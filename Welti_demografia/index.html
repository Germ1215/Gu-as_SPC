    <style>

            border: 2px solid transparent;

            cursor: pointer;
        }
        .option:hover:not(.disabled) {
            background: #e4ecf7;
            border-color: #b8cbe0;
        }
        .option input[type="radio"] {
            margin-right: 16px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #1f3a6b;
        }
        .option label {
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            color: #1a2a44;
            font-weight: 450;
        }
        .correct-answer {
            background: #d4edda;
            border-color: #28a745;
        }
        .incorrect-answer {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .disabled {
            cursor: default;
            opacity: 0.95;
        }
        #feedback {
            margin-top: 18px;
            padding: 16px 20px;
            border-radius: 12px;
            background: #f8faff;
            border-left: 6px solid #3e5f8a;
            display: none;
            font-size: 15px;
            line-height: 1.5;
        }
        #feedback .fb-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }
        #feedback .fb-text {
            margin-top: 4px;
        }
        #navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        #nav-buttons {
            display: flex;
            gap: 12px;
        }
        button {
            padding: 10px 24px;
            background: #1a2b4a;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
        }
        button:hover:not(:disabled) {
            background: #2c4070;
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        #progress {
            font-size: 14px;
            color: #3d4f6e;
            background: #e9eef6;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 500;
        }
        #score-display {
            font-size: 20px;
            font-weight: 700;
            color: #0b1e3a;
            margin-top: 16px;
            text-align: center;
            padding: 12px;
            background: #eef2f9;
            border-radius: 16px;
            border: 1px solid #d0dbe8;
        }
        @media (max-width: 600px) {
            #exam-container { padding: 18px 16px; }
            #question-text { font-size: 16px; }
            .option { padding: 12px 14px; }
            button { padding: 8px 16px; font-size: 14px; }
            #progress { font-size: 13px; padding: 4px 12px; }
        }
    </style>
</head>
<body>
<div id="exam-container">
    <h1>📊 Qué es la Demografía</h1>
    <div class="subtitle">Welti, 1997 · Capítulos I y III · 30 preguntas</div>

    <div id="question-area">
        <div id="question-number"></div>
        <div id="question-text"></div>
        <div id="options-container"></div>
        <div id="feedback"></div>
        <div id="navigation">
            <div id="nav-buttons">
                <button id="prevBtn" disabled>◀ Anterior</button>
                <button id="nextBtn">Siguiente ▶</button>
            </div>
            <div id="progress">Pregunta 1 / 30</div>
        </div>
        <div id="score-display"></div>
    </div>
</div>

<script>
    // ----------------------------------------------------------------
    // BASE DE DATOS DE 30 PREGUNTAS (corregida la 21)
    // ----------------------------------------------------------------
    const questions = [
        // P1
        {
            text: "Según el Diccionario demográfico multilingüe de la UIECP, la Demografía es una ciencia cuyo fin es el estudio de la población humana, ocupándose de su dimensión, estructura, evolución y caracteres generales, considerados principalmente desde el punto de vista:",
            options: [
                "Cualitativo.",
                "Cuantitativo.",
                "Sociológico.",
                "Económico."

            correct: 1,
            feedback: "Correcto. El texto dice: 'considerados principalmente desde el punto de vista cuantitativo' (página 14)."
        },
        // P2
        {
            text: "Un destacado sociodemógrafo (Preston) define convencionalmente la Demografía como:",

                "'El estudio de la población humana en su aspecto cuantitativo'.",
                "'El estudio de los determinantes y las consecuencias del tamaño y estructura de la población'.",
                "'El estudio de la distribución espacial de la población'.",
                "'El estudio de los procesos de natalidad y mortalidad'."
            ],
            correct: 1,
            feedback: "Correcto. Es la definición de Preston citada en la página 14."
        },
        // P3
        {
            text: "El área temática de la Demografía se compone de:",
            options: [
                "La estructura, la dinámica y los componentes de la dinámica: fecundidad, mortalidad y migración.",
                "Solo la estructura y la dinámica de la población.",
                "La estructura por edad y sexo, y la fecundidad.",
                "La mortalidad, la fecundidad y la nupcialidad."
            ],
            correct: 0,
            feedback: "Correcto. El texto señala: 'el área temática de la Demografía se compone de la estructura, la dinámica y los componentes de la dinámica de las poblaciones humanas: la fecundidad, la mortalidad y la migración' (página 14)."
        },
        // P4
        {
            text: "En Demografía, el concepto de estructura de la población alude estrictamente a:",
            options: [
                "La organización social y económica de una población.",
                "La distribución o composición de la población según diferentes rasgos, como edad, sexo, estado civil, etc.",
                "La forma en que se relacionan los individuos en una sociedad.",
                "El número total de habitantes de un territorio."
            ],
            correct: 1,
            feedback: "Correcto. El texto define estructura como la distribución según rasgos (edad, sexo, estado civil, etc.) – página 14."
        },
        // P5
        {
            text: "Según el texto, ¿cuáles son las características básicas de una población en el análisis demográfico?",
            options: [
                "Edad y sexo.",
                "Edad y estado civil.",
                "Sexo y actividad económica.",
                "Localización espacial y nivel educativo."
            ],
            correct: 0,
            feedback: "Correcto. 'La edad y el sexo son las características básicas de una población' – página 14."
        },
        // P6
        {
            text: "La dinámica de la población se refiere a:",
            options: [
                "La distribución de la población según edad y sexo.",

                "El estudio de las migraciones internacionales.",
                "El análisis de la estructura por edad en un momento dado."
            ],
            correct: 1,
            feedback: "Correcto. Definición de dinámica en la página 15."
        },
        // P7
        {
            text: "En una población total, los procesos de entrada son:",
            options: [
                "La mortalidad y la emigración.",
                "La natalidad y la inmigración.",
                "La fecundidad y la mortalidad.",
                "La migración y la nupcialidad."
            ],
            correct: 1,
            feedback: "Correcto. 'la natalidad y la inmigración son procesos de entrada' – página 15."
        },
        // P8
        {
            text: "En el estudio de subpoblaciones (por ejemplo, grupo de edad 5-9 años), ¿qué proceso adicional puede operar como entrada o salida?",
            options: [
                "La fecundidad.",
                "El cumpleaños (cambio de edad) o la reclasificación.",
                "La mortalidad.",
                "La migración internacional."
            ],
            correct: 1,
            feedback: "Correcto. 'el mecanismo que define la entrada al segmento de la población que tiene entre 5 y 9 años de edad es el cumpleaños número 5... en el caso de la población rural existe un proceso de salida denominado reclasificación' – página 15."
        },
        // P9
        {
            text: "Para el estudio de hechos demográficos, los materiales básicos son:",
            options: [
                "El número de habitantes y la superficie territorial.",
                "El número absoluto de hechos demográficos y la población relacionada con estos hechos.",
                "Las tasas de natalidad y mortalidad.",
                "Los censos y las encuestas."
            ],
            correct: 1,
            feedback: "Correcto. 'Los materiales básicos para utilizar estas medidas son: i) el número absoluto de hechos demográficos... ii) la población relacionada con estos hechos' – página 54."
        },
        // P10
        {
            text: "Una relación (o razón) se define como:",
            options: [
                "Un cociente en el que numerador y denominador pertenecen a poblaciones diferentes.",
                "Un cociente en el que numerador y denominador pertenecen a la misma población.",
                "Una medida que expresa la frecuencia relativa de un evento en un periodo.",
                "La proporción de una parte respecto al todo."
            ],
            correct: 0,
            feedback: "Correcto. 'Cociente en que el numerador y el denominador pertenecen a poblaciones diferentes' – página 54."
        },
        // P11
        {
            text: "La proporción se caracteriza por:",
            options: [
                "Ser un cociente entre poblaciones diferentes.",
                "Representar una parte con referencia al todo, usando la misma categoría de hechos u objetos en numerador y denominador.",
                "Medir la frecuencia de un evento en un año.",
                "Ser siempre expresada como porcentaje."
            ],
            correct: 1,
            feedback: "Correcto. 'Magnitud que representa una parte con referencia al todo' usando la misma categoría – página 54."
        },
        // P12
        {
            text: "¿Qué interpretación tiene una proporción cuando se expresa por cien?",
            options: [
                "El número de unidades del numerador por cada 100 unidades del denominador.",
                "El porcentaje que representa la parte respecto al todo.",
                "La frecuencia relativa del evento por cada 100 habitantes.",
                "La probabilidad de ocurrencia del evento."
            ],
            correct: 1,
            feedback: "Correcto. 'Cuando se expresa por cien se denomina porcentaje' y su interpretación es la importancia relativa de la parte – página 54."
        },
        // P13
        {
            text: "La tasa se define como:",
            options: [
                "La proporción de una parte respecto al todo.",
                "La frecuencia relativa con que un evento se presenta dentro de una población en un determinado periodo de tiempo.",
                "El cociente entre poblaciones diferentes.",
                "La probabilidad de que un evento ocurra en una cohorte."
            ],
            correct: 1,
            feedback: "Correcto. Definición de tasa: 'frecuencia relativa con que un evento se presenta dentro de una población... en un determinado periodo' – página 54."
        },
        // P14
        {
            text: "En el numerador de una tasa se incluye:",
            options: [
                "La población expuesta al riesgo.",
                "El número de hechos demográficos (por ejemplo, defunciones, nacimientos).",
                "El tiempo vivido por la población.",
                "La población media del periodo."
            ],
            correct: 1,
            feedback: "Correcto. 'En el numerador se incluye el número de hechos demográficos' – página 55."
        },
        // P15
        {
            text: "En el denominador de una tasa, en rigor, debería utilizarse:",
            options: [
                "La población total del país.",

                "El tiempo vivido por la población (años-persona expuestos al riesgo).",
                "La población al inicio del periodo."
            ],
            correct: 2,
            feedback: "Correcto. 'en el denominador la población expuesta al riesgo de ser afectada por ese hecho demográfico durante el periodo de referencia (tiempo vivido)' – página 55."
        },
        // P16
        {
            text: "En la práctica, el denominador de las tasas se simplifica y se utiliza:",
            options: [
                "La población al final del periodo.",
                "La población media del periodo considerado.",
                "El tiempo vivido estimado.",
                "La población inicial."
            ],
            correct: 1,
            feedback: "Correcto. 'el que normalmente se simplifica y se traduce como la población media del periodo considerado' – página 55."
        },
        // P17
        {
            text: "Las tasas brutas se refieren a:",
            options: [
                "Subgrupos de la población diferenciados por edad.",
                "Toda la población en su conjunto.",
                "Poblaciones cerradas.",
                "Un periodo de varios años."
            ],
            correct: 1,
            feedback: "Correcto. 'Las tasas brutas se refieren a toda la población en su conjunto' – página 55."
        },
        // P18
        {
            text: "Las tasas específicas se diferencian de las brutas porque:",
            options: [
                "Se refieren a toda la población.",
                "Se calculan para subgrupos de la población (por ejemplo, por edad, sexo, estado civil).",
                "Se expresan como porcentajes.",
                "Utilizan como denominador la población total."

            feedback: "Correcto. 'las tasas específicas se refieren a subgrupos de la población diferenciados por distintas características' – página 55."
        },
        // P19
        {
            text: "La probabilidad en Demografía se define como:",
            options: [
                "La frecuencia relativa de un evento en un año calendario.",
                "La relación en la cual el denominador es la población inicialmente expuesta al riesgo y el numerador la cantidad de eventos que experimentó dicha población durante un lapso de su vida.",

            ],
            correct: 1,
            feedback: "Correcto. Definición de probabilidad en página 56: 'Relación en la cual el denominador es la población que inicialmente está expuesta al riesgo... y en el numerador la cantidad de eventos que ha experimentado dicha población durante un cierto lapso de su vida'."
        },
        // P20
        {
            text: "¿Qué mide la probabilidad de muerte entre los 20 y los 25 años de una generación?",
            options: [
                "La cantidad de personas que fallecieron en ese grupo de edad en un año.",
                "La proporción de personas de esa generación que llegaron con vida a los 20 años pero fallecieron antes de cumplir los 25.",
                "La tasa de mortalidad anual para ese grupo de edad.",
                "El número de defunciones por cada 1000 habitantes en esa edad."
            ],
            correct: 1,
            feedback: "Correcto. El ejemplo: 'probabilidad de morir, entre los 20 y los 25 años, de la generación... indica la cantidad de personas de esta generación que llegaron con vida a los 20 años exactos, pero que fallecieron antes de cumplir los 25' – página 56."
        },
        // P21 (corregida: ahora incluye las definiciones en el enunciado)
        {
            text: `Relacione correctamente el tipo de medida con su definición:

            a) Cociente entre poblaciones diferentes.
            b) Parte respecto al todo (misma categoría).
            c) Frecuencia relativa de un evento en una población expuesta en un periodo.
            d) Proporción de una población inicial que experimenta un evento durante un lapso de vida.

            1. Relación
            2. Proporción
            3. Tasa
            4. Probabilidad`,

            options: [
                "1-c, 2-b, 3-a, 4-d",
                "1-a, 2-c, 3-b, 4-d",
                "1-b, 2-a, 3-c, 4-d",
                "1-d, 2-b, 3-a, 4-c"
            ],
            correct: 0,
            feedback: "Correcto. Según las definiciones: Relación = cociente entre poblaciones diferentes (a) → 1-a, no, espera: en la opción correcta es 1-c. Revisemos: En la opción A: 1-c, 2-b, 3-a, 4-d. Eso significa Relación→c, Proporción→b, Tasa→a, Probabilidad→d. Correcto: Relación es c (cociente entre poblaciones diferentes), Proporción es b (parte respecto al todo), Tasa es a (frecuencia relativa), Probabilidad es d (proporción de población inicial que experimenta evento)."
        },
        // P22
        {
            text: "Un ejemplo de relación (o razón) en Demografía es:",
            options: [
                "La tasa bruta de natalidad.",
                "La relación de masculinidad (hombres/mujeres).",
                "La proporción de defunciones infantiles.",
                "La probabilidad de muerte."
            ],
            correct: 1,
            feedback: "Correcto. La relación de masculinidad es un ejemplo de relación (cociente entre dos poblaciones: hombres y mujeres) – página 54."
        },
        // P23
        {
            text: "Cuando la proporción se expresa por cien, se denomina:",
            options: [
                "Relación.",
                "Tasa.",
                "Porcentaje.",
                "Probabilidad."
            ],
            correct: 2,
            feedback: "Correcto. 'Cuando se expresa por cien se denomina porcentaje' – página 54."
        },
        // P24
        {
            text: "Las tasas de periodo (o de contemporáneos) son aquellas que:",
            options: [
                "Corresponden a individuos que nacieron en un mismo periodo.",
                "Corresponden a un determinado periodo del calendario y resultan del análisis transversal.",
                "Se calculan para cohortes específicas.",
                "Se refieren a la experiencia de una generación."
            ],
            correct: 1,
            feedback: "Correcto. 'tasas de periodos (o de contemporáneos), que son las correspondientes a un determinado periodo de tiempo del calendario, resultantes de un análisis transversal' – página 56."
        },
        // P25
        {
            text: "Las tasas de cohortes (o de generaciones) se basan en:",
            options: [
                "Un periodo de calendario fijo.",
                "Individuos que nacieron en un mismo periodo de tiempo (análisis longitudinal).",
                "La población total de un año.",
                "Los datos de un censo."
            ],
            correct: 1,
            feedback: "Correcto. 'tasas de cohortes (o de generaciones), que son las que corresponden a individuos que nacieron en un mismo periodo de tiempo, y que resultan del análisis longitudinal' – página 56."
        },
        // P26
        {
            text: "Complete la oración: 'En una tasa, el denominador debiera ser el tiempo vivido, pero en la práctica se reemplaza por _______.'",
            options: [
                "la población total.",
                "la población media del periodo.",
                "la población al inicio del periodo.",
                "la población al final del periodo."
            ],

            feedback: "Correcto. 'se simplifica y se traduce como la población media del periodo considerado' – página 55."
        },
        // P27

            text: "La interpretación de una tasa (por ejemplo, tasa de mortalidad) es:",
            options: [
                "El número de hechos por cada 100 unidades del denominador.",
                "La frecuencia relativa con que ocurre el evento respecto a la población expuesta.",
                "La proporción de la población que experimenta el evento en toda su vida.",
                "El cociente entre poblaciones diferentes."
            ],
            correct: 1,
            feedback: "Correcto. 'Se interpretan como la frecuencia relativa con que ocurre el hecho demográfico en cuestión respecto de la población' – página 55."
        },
        // P28
        {
            text: "¿Cuál de las siguientes afirmaciones sobre las medidas demográficas es correcta según el texto?",
            options: [
                "La relación y la proporción son conceptos equivalentes.",
                "La tasa siempre se expresa como porcentaje.",
                "La probabilidad tiene como denominador la población expuesta al riesgo en un periodo, mientras que la tasa usa la población inicial.",

            ],
            correct: 3,
            feedback: "Correcto. La diferencia clave: tasa usa población expuesta (tiempo vivido/población media) y probabilidad usa población inicial – páginas 55-56."
        },
        // P29
        {
            text: "Según el texto, los determinantes de la dinámica demográfica son en última instancia de orden:",
            options: [
                "Biológico.",
                "Social.",
                "Económico.",
                "Geográfico."
            ],
            correct: 1,
            feedback: "Correcto. 'los determinantes de la dinámica demográfica son en última instancia de orden social' – página 16."
        },
        // P30
        {
            text: "La Demografía, para el estudio de la estructura y dinámica de la población, se concentra en la investigación de tres factores principales. ¿Cuáles son?",
            options: [
                "Natalidad, nupcialidad y migración.",
                "Mortalidad, natalidad/fecundidad y migración.",
                "Edad, sexo y localización.",
                "Crecimiento, distribución y estructura."
            ],
            correct: 1,
            feedback: "Correcto. 'la Demografía se concentra en la investigación de los principales factores que influyen sobre ambos aspectos: a) la mortalidad. b) la natalidad y la fecundidad. c) la migración' – página 15."

    // ----------------------------------------------------------------
    // LÓGICA DEL EXAMEN
    // ----------------------------------------------------------------
    const totalQuestions = questions.length;
    let currentIndex = 0;
    let answers = new Array(totalQuestions).fill(null);
    let answered = new Array(totalQuestions).fill(false);

    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackEl = document.getElementById('feedback');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressEl = document.getElementById('progress');
    const scoreDisplay = document.getElementById('score-display');

    function renderQuestion(index) {
        const q = questions[index];
        questionNumberEl.textContent = `Pregunta ${index+1} de ${totalQuestions}`;
        questionTextEl.innerHTML = q.text.replace(/\n/g, '<br>');

        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'option';
            if (answered[index]) {
                div.classList.add('disabled');
                if (idx === q.correct) div.classList.add('correct-answer');
                else if (answers[index] === idx && idx !== q.correct) div.classList.add('incorrect-answer');
            } else {
                div.style.cursor = 'pointer';
            }
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'question';
            radio.value = idx;
            if (answers[index] === idx) radio.checked = true;
            radio.disabled = answered[index];
            const label = document.createElement('label');
            label.innerHTML = `${letters[idx]}) ${opt}`;
            div.appendChild(radio);
            div.appendChild(label);
            if (!answered[index]) {
                div.addEventListener('click', function(e) {
                    if (answered[currentIndex]) return;
                    const radioInside = this.querySelector('input[type="radio"]');
                    radioInside.checked = true;
                    handleOptionSelect(idx);
                });
            }
            optionsContainer.appendChild(div);
        });

        // Feedback
        if (answered[index]) {
            const isCorrect = (answers[index] === q.correct);
            const fb = q.feedback || (isCorrect ? 'Correcto.' : 'Incorrecto.');
            feedbackEl.style.display = 'block';
            feedbackEl.innerHTML = `
                <div class="fb-title" style="color: ${isCorrect ? '#28a745' : '#dc3545'}">
                    ${isCorrect ? '✅ Correcto' : '❌ Incorrecto'}
                </div>
                <div class="fb-text">${fb}</div>
            `;
        } else {
            feedbackEl.style.display = 'none';
        }

        prevBtn.disabled = (index === 0);
        nextBtn.disabled = false;
        progressEl.textContent = `Pregunta ${index+1} / ${totalQuestions}`;

        if (answered.every(a => a === true)) {
            const correctCount = answers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
            const percent = Math.round((correctCount / totalQuestions) * 100);
            scoreDisplay.textContent = `✅ Calificación final: ${correctCount}/${totalQuestions} (${percent}%)`;
        } else {
            scoreDisplay.textContent = '';
        }
    }

    function handleOptionSelect(selectedIdx) {
        if (answered[currentIndex]) return;
        const q = questions[currentIndex];
        answers[currentIndex] = selectedIdx;
        answered[currentIndex] = true;
        renderQuestion(currentIndex);
        if (currentIndex === totalQuestions - 1) {
            const correctCount = answers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
            const percent = Math.round((correctCount / totalQuestions) * 100);
            scoreDisplay.textContent = `✅ Calificación final: ${correctCount}/${totalQuestions} (${percent}%)`;
        }
    }

    function goToPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    }

    function goToNext() {
        if (currentIndex < totalQuestions - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            if (answered[currentIndex]) {
                const correctCount = answers.reduce((acc, ans, idx) => {
                    return acc + (ans === questions[idx].correct ? 1 : 0);
                }, 0);
                const percent = Math.round((correctCount / totalQuestions) * 100);
                scoreDisplay.textContent = `✅ Calificación final: ${correctCount}/${totalQuestions} (${percent}%)`;
            }
        }
    }

    renderQuestion(0);
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') goToPrev();
        else if (e.key === 'ArrowRight') goToNext();
    });
</script>
</body>
</html>
