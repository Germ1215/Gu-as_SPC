<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Interactivo – Diseño Conceptual INEGI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
        }
        .container {
            background: white;
            max-width: 850px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.05);
            padding: 2rem 2rem 2rem;
            transition: all 0.2s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e2b3c;
            letter-spacing: -0.3px;
        }
        .progress {
            background: #e9edf4;
            border-radius: 40px;
            padding: 0.35rem 1rem;
            font-weight: 500;
            color: #1e2b3c;
            font-size: 0.9rem;
        }
        .pregunta-texto {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #1e2b3c;
            margin-bottom: 1.8rem;
            font-weight: 500;
            background: #f9fafc;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            border-left: 5px solid #2a7de1;
        }
        .opciones {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-bottom: 2rem;
        }
        .opcion {
            display: flex;
            align-items: center;
            background: #f9fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 0.9rem 1.2rem;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 1rem;
            color: #1e2b3c;
        }
        .opcion:hover {
            background: #edf2f9;
            border-color: #b3c7e5;
        }
        .opcion.seleccionada {
            background: #dbeafe;
            border-color: #2a7de1;
            box-shadow: 0 0 0 2px rgba(42,125,225,0.2);
        }
        .opcion.correcta {
            background: #d1fae5;
            border-color: #0b8a4a;
        }
        .opcion.incorrecta {
            background: #fee2e2;
            border-color: #b91c1c;
        }
        .opcion.deshabilitada {
            cursor: default;
            opacity: 0.8;
        }
        .opcion .letra {
            font-weight: 700;
            color: #4a5a72;
            margin-right: 1rem;
            min-width: 28px;
        }
        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        .btn {
            background: white;
            border: 2px solid #d0d9e8;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e2b3c;
            cursor: pointer;
            transition: all 0.15s;
            background: #f9fafc;
        }
        .btn:hover:not(:disabled) {
            background: #e9edf4;
            border-color: #a0b5d0;
        }
        .btn.primario {
            background: #1e2b3c;
            border-color: #1e2b3c;
            color: white;
        }
        .btn.primario:hover:not(:disabled) {
            background: #2a3d54;
            border-color: #2a3d54;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .feedback {
            margin-top: 1.8rem;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            background: #f0f4fe;
            border-left: 5px solid #2a7de1;
            display: none;
        }
        .feedback.mostrar {
            display: block;
        }
        .feedback .correcto {
            color: #0b7a3e;
            font-weight: 700;
        }
        .feedback .incorrecto {
            color: #b91c1c;
            font-weight: 700;
        }
        .feedback .justificacion {
            margin-top: 0.6rem;
            color: #1e2b3c;
            line-height: 1.5;
        }
        .feedback .distractores {
            margin-top: 0.5rem;
            font-size: 0.95rem;
            color: #3d4e66;
            background: #e8edf5;
            padding: 0.7rem 1rem;
            border-radius: 10px;
        }
        .footer {
            margin-top: 2rem;
            border-top: 2px solid #e9edf4;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .resultado-final {
            background: #1e2b3c;
            color: white;
            padding: 1.2rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.2rem;
            text-align: center;
            margin-top: 1rem;
        }
        .oculto {
            display: none !important;
        }
        @media (max-width: 600px) {
            .container { padding: 1.2rem; }
            .pregunta-texto { font-size: 1rem; padding: 1rem; }
            .opcion { padding: 0.7rem 1rem; font-size: 0.95rem; }
            .btn { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>📊 Diseño Conceptual · INEGI</h1>
        <span class="progress" id="progreso">1 / 100</span>
    </div>

    <div id="preguntaContainer">
        <div class="pregunta-texto" id="preguntaTexto">Cargando pregunta…</div>
        <div class="opciones" id="opcionesContainer"></div>
    </div>

    <div class="acciones">
        <button class="btn" id="btnResponder" disabled>▶ Responder</button>
        <button class="btn primario" id="btnSiguiente" disabled>Siguiente →</button>
    </div>

    <div class="feedback" id="feedback">
        <div id="feedbackResultado"></div>
        <div class="justificacion" id="feedbackJustificacion"></div>
        <div class="distractores" id="feedbackDistractores"></div>
    </div>

    <div class="footer">
        <span id="aciertosTexto">Aciertos: 0</span>
        <span id="preguntaNumero">Pregunta 1 de 100</span>
    </div>

    <div id="resultadoFinal" class="resultado-final oculto"></div>
</div>

<script>
    // ============================================================
    // DATOS: 100 preguntas (opciones A, B, C, D)
    // Cada objeto: { id, texto, opciones: {A, B, C, D}, correcta, justificacion, distractores }
    // ============================================================
    const preguntas = [
        // 1
        {
            id: 1,
            texto: "El diseño conceptual es la fase del proceso de generación de estadística básica que consiste en una serie de actividades para identificar las necesidades de información y determinar: el marco conceptual, los instrumentos de captación, los criterios de validación y _______________.",
            opciones: {
                A: "el diseño de la muestra",
                B: "el esquema para la presentación de resultados",
                C: "la planeación estratégica",
                D: "la codificación de los datos"
            },
            correcta: "B",
            justificacion: "Página 7: 'El diseño conceptual es: Serie de actividades para identificar las necesidades de información y determinar: El marco conceptual, los instrumentos de captación, los criterios de validación y el esquema para la presentación de resultados.'",
            distractores: "A es fase de diseño de muestra; C es fase de planeación; D es parte del procesamiento."
        },
        // 2
        {
            id: 2,
            texto: "Relaciona cada atributo de calidad con su definición: 1. Relevancia, 2. Rigor conceptual, 3. Confiabilidad, 4. Oportunidad. A) Grado en que un dato se aproxima a la veracidad. B) Lapso mínimo entre presentación de resultados y referencia temporal. C) Utilidad para atender necesidades. D) Denominaciones claras y precisas.",
            opciones: {
                A: "1-C, 2-D, 3-A, 4-B",
                B: "1-D, 2-C, 3-B, 4-A",
                C: "1-A, 2-B, 3-C, 4-D",
                D: "1-B, 2-A, 3-D, 4-C"
            },
            correcta: "A",
            justificacion: "Página 10, cuadro de atributos. Relevancia: utilidad; Rigor conceptual: claridad; Confiabilidad: aproximación a la veracidad; Oportunidad: lapso mínimo.",
            distractores: "Las otras opciones invierten las relaciones correctas entre atributos y definiciones."
        },
        // 3
        {
            id: 3,
            texto: "¿Cuál de las siguientes afirmaciones sobre la investigación documental es INCORRECTA según el documento?",
            opciones: {
                A: "Incluye revisión de antecedentes, recomendaciones internacionales, leyes y reglamentos.",
                B: "Sus productos incluyen fichas con variables, preguntas, criterios de validación y sistemas de clasificación.",
                C: "Se realiza únicamente al inicio del diseño conceptual y no interactúa con otras macroactividades.",
                D: "Ayuda a resolver controversias entre lo que se quiere captar y lo que se puede captar."
            },
            correcta: "C",
            justificacion: "Página 12: 'Esta primer macroactividad puede tener diferentes momentos e interactuar con todas las demás.'",
            distractores: "A, B y D son afirmaciones correctas según el texto."
        },
        // 4
        {
            id: 4,
            texto: "El marco conceptual es un esquema bajo el cual se presenta, en forma ordenada y con los vínculos correspondientes, el conjunto de conceptos referentes a _______________, con sus respectivas definiciones.",
            opciones: {
                A: "temas, categorías, variables y clasificaciones",
                B: "preguntas, opciones de respuesta y rangos de validación",
                C: "unidades de observación, informantes y entrevistadores",
                D: "productos estadísticos, medios y formas de divulgación"
            },
            correcta: "A",
            justificacion: "Página 8: 'El marco conceptual es el esquema bajo el cual se presenta, en forma ordenada y con los vínculos correspondientes, el conjunto de conceptos referentes a temas, categorías, variables y clasificaciones con sus respectivas definiciones.'",
            distractores: "Las otras opciones describen otros elementos del proyecto (cuestionario, operativos, divulgación)."
        },
        // 5
        {
            id: 5,
            texto: "Relaciona cada tipo de variable según la forma como se capta: 1. Variable directa, 2. Variable indirecta. A) Cuyos valores se obtienen a partir de información sobre otros atributos. B) Cuyos valores son observables en cada elemento.",
            opciones: {
                A: "1-A, 2-B",
                B: "1-B, 2-A",
                C: "1-B, 2-B",
                D: "1-A, 2-A"
            },
            correcta: "B",
            justificacion: "Página 27: Variable directa = valores observables en cada elemento; indirecta = valores obtenidos a partir de otros atributos o categorías.",
            distractores: "Las otras opciones invierten o repiten las relaciones incorrectamente."
        },
        // 6
        {
            id: 6,
            texto: "En el contexto de la validación, los criterios de validación son reglas de naturaleza conceptual que se utilizan para:",
            opciones: {
                A: "Diseñar el marco muestral y seleccionar la muestra.",
                B: "Revisar y corregir los datos que así lo requieran, sin alterar los datos válidos originales.",
                C: "Definir los objetivos y alcance del proyecto estadístico.",
                D: "Establecer los formatos de presentación de resultados."
            },
            correcta: "B",
            justificacion: "Página 47: 'los criterios de validación son reglas de naturaleza conceptual que se utilizan para revisar y, en su caso, proponer la solución más adecuada para aquellos datos que presentan algún tipo de error o inconsistencia... asegure la eliminación de errores, sin alterar los datos válidos originales.'",
            distractores: "A es diseño de muestra; C es planeación; D es presentación de resultados."
        },
        // 7
        {
            id: 7,
            texto: "Los criterios de prioridad permiten jerarquizar y seleccionar conceptos, y se basan en: relevancia para planeación gubernamental, importancia para programas privados y académicos, compromisos internacionales, impacto social y _______________.",
            opciones: {
                A: "el costo de captación de cada variable",
                B: "la frecuencia con que se solicita determinada información",
                C: "la disponibilidad de informantes",
                D: "la complejidad de las definiciones"
            },
            correcta: "B",
            justificacion: "Página 18: 'Los criterios de prioridad... tales como: la relevancia... importancia... compromisos... impacto social... la frecuencia con que se solicita determinada información.'",
            distractores: "Las otras opciones no se mencionan como criterios de prioridad."
        },
        // 8
        {
            id: 8,
            texto: "Relaciona cada problema de integridad: 1. Subcobertura, 2. Registros duplicados, 3. Omisión de respuesta. A) Repetición de datos de la misma unidad. B) Ausencia de respuestas donde debería haberlas. C) Falta de registro de unidades completas.",
            opciones: {
                A: "1-A, 2-B, 3-C",
                B: "1-B, 2-C, 3-A",
                C: "1-C, 2-A, 3-B",
                D: "1-C, 2-B, 3-A"
            },
            correcta: "C",
            justificacion: "Página 48: subcobertura = falta de registro de unidades; registros duplicados = repetición; omisión = ausencia de respuestas.",
            distractores: "Las otras combinaciones son incorrectas."
        },
        // 9
        {
            id: 9,
            texto: "La idoneidad del proyecto se refiere a:",
            opciones: {
                A: "La capacidad técnica para captar datos con la mayor precisión posible.",
                B: "El conjunto de elementos que permiten determinar si el proyecto es el adecuado para captar una variable, en términos de confiabilidad, oportunidad, desglose geográfico y costo.",
                C: "La factibilidad de captación basada exclusivamente en el presupuesto disponible.",
                D: "La aprobación de los usuarios externos para realizar el proyecto."
            },
            correcta: "B",
            justificacion: "Página 18: 'Idoneidad del proyecto. Es el conjunto de elementos que permiten determinar para cada variable, si el proyecto en desarrollo es el adecuado para captarla, en términos de confiabilidad, oportunidad, desglose geográfico y costo.'",
            distractores: "A es parcial pero no incluye todos los elementos; C reduce a presupuesto; D no se menciona."
        },
        // 10
        {
            id: 10,
            texto: "Una clasificación es el ordenamiento de todas las ______________ admitidos por una variable.",
            opciones: {
                A: "modalidades nominales o intervalos numéricos",
                B: "preguntas y opciones de respuesta",
                C: "categorías y subcategorías",
                D: "definiciones conceptuales"
            },
            correcta: "A",
            justificacion: "Página 31: 'Es el ordenamiento de todas las modalidades nominales o intervalos numéricos admitidos por una variable.'",
            distractores: "Las otras opciones no corresponden a la definición de clasificación."
        },
        // 11
        {
            id: 11,
            texto: "Según el documento, la accesibilidad se refiere a:",
            opciones: {
                A: "La facilidad con que los usuarios pueden establecer la existencia de la información y precisar su localización, así como la sencillez de los procedimientos para acceder a ella.",
                B: "El grado en que los datos se aproximan a la veracidad.",
                C: "El lapso mínimo entre la captación y la difusión de los datos.",
                D: "La claridad y precisión de las definiciones."
            },
            correcta: "A",
            justificacion: "Página 11: 'Accesibilidad. Se refiere tanto a la facilidad con la que los usuarios pueden establecer la existencia de la información estadística requerida y precisar su localización, como a la sencillez de los procedimientos que les permitan acceder a ella.'",
            distractores: "B es confiabilidad; C es oportunidad; D es rigor conceptual."
        },
        // 12
        {
            id: 12,
            texto: "En la integración del marco conceptual, ¿cuál de las siguientes afirmaciones es correcta?",
            opciones: {
                A: "El marco conceptual debe ser idéntico al cuestionario en número de preguntas.",
                B: "Una variable puede traducirse operativamente en dos o más preguntas.",
                C: "Las variables indirectas siempre se captan mediante una sola pregunta directa.",
                D: "Los temas, categorías y variables no requieren definiciones separadas."
            },
            correcta: "B",
            justificacion: "Página 20: 'Si bien el marco conceptual debe tener una correspondencia con el cuestionario, con fines operativos pueden presentarse las siguientes situaciones: • Una variable se traduce operativamente en dos o más preguntas.'",
            distractores: "A es falso; C falso (las indirectas no se captan con una sola); D falso (sí requieren definiciones)."
        },
        // 13
        {
            id: 13,
            texto: "Relaciona el tipo de variable según el número de valores: 1. Variable dicotómica, 2. Variable polinomial. A) Sexo (Hombre/Mujer), B) Ocupación (muchas categorías).",
            opciones: {
                A: "1-A, 2-B",
                B: "1-B, 2-A",
                C: "1-A, 2-A",
                D: "1-B, 2-B"
            },
            correcta: "A",
            justificacion: "Página 26-27: dicotómica admite solo dos valores (ej. sexo); polinomial admite tres o más (ej. ocupación).",
            distractores: "Las otras opciones invierten o repiten incorrectamente."
        },
        // 14
        {
            id: 14,
            texto: "¿Cuál de las siguientes NO es una regla básica para la elaboración de definiciones en el contexto estadístico, según el documento?",
            opciones: {
                A: "Cubrir las características esenciales del concepto.",
                B: "Redactar en forma clara, precisa y sencilla.",
                C: "Incluir ejemplos para facilitar la comprensión.",
                D: "No utilizar el término objeto de la definición en la misma definición."
            },
            correcta: "C",
            justificacion: "Página 37: reglas básicas incluyen 'No incluir ejemplos.'",
            distractores: "A, B y D son reglas correctas según el texto."
        },
        // 15
        {
            id: 15,
            texto: "En el diseño del esquema para la presentación de resultados, la segmentación de usuarios consiste en:",
            opciones: {
                A: "Identificar similitudes entre los usuarios para definir perfiles y determinar grupos con base en sus características.",
                B: "Clasificar a los usuarios según su nivel socioeconómico.",
                C: "Asignar aleatoriamente los productos a los usuarios.",
                D: "Seleccionar únicamente a los usuarios más importantes para el proyecto."
            },
            correcta: "A",
            justificacion: "Página 40: 'segmentación de los usuarios; ésta consiste en la identificación de similitudes entre los usuarios para definir sus perfiles y determinar grupos con base en sus características.'",
            distractores: "Las otras opciones no corresponden a la definición."
        },
        // 16
        {
            id: 16,
            texto: "Los criterios de validación incluyen reglas para la revisión y para encarar la solución de problemas. ¿Cuál de los siguientes NO es un tipo de solución recomendado?",

                A: "Rectificación del valor mediante reconsulta.",
                B: "Derivación aritmética de un valor.",
                C: "Eliminación del cuestionario completo.",
                D: "Estimación del valor con base en métodos estadísticos."
            },
            correcta: "C",
            justificacion: "Página 52: los tipos de solución son rectificación, derivación aritmética, estimación estadística y asignación de 'no especificado'. No se menciona eliminar todo el cuestionario.",

        },
        // 17
        {
            id: 17,
            texto: "La categoría es:",
            opciones: {
                A: "El enunciado genérico de un campo de conocimiento.",

            correcta: "C",
            justificacion: "Página 22: 'La categoría es un conjunto de elementos que puede ser cuantificado y caracterizado.' (y glosario p.57).",

        },
        // 18
        {
            id: 18,
            texto: "En el nivel operativo, la distribución de frecuencias de una variable se puede presentar en números absolutos o relativos y recibe denominaciones como:",
            opciones: {
                A: "Composición, estructura, participación o distribución.",

        // 19

            id: 19,

            opciones: {

            },
            correcta: "A",
            justificacion: "Páginas 14-15: antecedentes → variables, problemas; recomendaciones internacionales → comparabilidad; leyes → conceptos y restricciones.",

        },
        // 20
        {
            id: 20,
            texto: "La suficiencia, como atributo de calidad, se define como:",
            opciones: {
                A: "El grado en que las estadísticas disponibles permiten el conocimiento de un objeto o fenómeno respecto a sus aspectos de magnitud, estructura, distribución, comportamiento temporal e interrelación.",
                B: "La facilidad con que los usuarios pueden acceder a la información.",
                C: "El grado en que los datos son comparables con otras fuentes.",
                D: "La claridad y precisión de las definiciones."
            },
            correcta: "A",
            justificacion: "Página 11: 'Suficiencia. Grado en el que las estadísticas disponibles permiten el conocimiento de un objeto o fenómeno respecto a sus aspectos de magnitud, estructura, distribución, comportamiento temporal e interrelación.'",
            distractores: "B es accesibilidad; C es comparabilidad; D es rigor conceptual."
        },
        // 21
        {
            id: 21,
            texto: "En el diseño de instrumentos de captación, el análisis del marco conceptual permite:",
            opciones: {
                A: "Determinar quién podrá proporcionar la información de manera más precisa, el tipo de entrevista, la referencia temporal de las variables y las formas de presentación.",

                C: "Establecer el tamaño de la muestra.",
                D: "Definir los indicadores económicos que se publicarán."

    // ============================================================
    // LÓGICA DE LA INTERFAZ
    // ============================================================
    let indiceActual = 0;
    let aciertos = 0;
    let respondida = false;
    let opcionSeleccionada = null;

    const preguntaTexto = document.getElementById('preguntaTexto');
    const opcionesContainer = document.getElementById('opcionesContainer');
    const btnResponder = document.getElementById('btnResponder');
    const btnSiguiente = document.getElementById('btnSiguiente');
    const feedback = document.getElementById('feedback');
    const feedbackResultado = document.getElementById('feedbackResultado');
    const feedbackJustificacion = document.getElementById('feedbackJustificacion');
    const feedbackDistractores = document.getElementById('feedbackDistractores');
    const progreso = document.getElementById('progreso');
    const aciertosTexto = document.getElementById('aciertosTexto');
    const preguntaNumero = document.getElementById('preguntaNumero');
    const resultadoFinal = document.getElementById('resultadoFinal');

    function renderPregunta(index) {
        const p = preguntas[index];
        preguntaTexto.textContent = `${index+1}. ${p.texto}`;
        const letras = ['A', 'B', 'C', 'D'];
        opcionesContainer.innerHTML = '';
        letras.forEach(letra => {
            const div = document.createElement('div');
            div.className = 'opcion';
            div.dataset.letra = letra;
            div.innerHTML = `<span class="letra">${letra}.</span> ${p.opciones[letra]}`;
            div.addEventListener('click', () => seleccionarOpcion(letra));
            opcionesContainer.appendChild(div);
        });

        // Resetear estado
        respondida = false;
        opcionSeleccionada = null;
        btnResponder.disabled = true;
        btnSiguiente.disabled = true;
        feedback.classList.remove('mostrar');
        // Limpiar clases de opciones
        document.querySelectorAll('.opcion').forEach(el => {
            el.classList.remove('seleccionada', 'correcta', 'incorrecta', 'deshabilitada');
        });

        actualizarInfo();
    }

    function seleccionarOpcion(letra) {
        if (respondida) return;
        // Quitar selección anterior
        document.querySelectorAll('.opcion').forEach(el => el.classList.remove('seleccionada'));
        // Marcar la seleccionada
        const opcionEl = document.querySelector(`.opcion[data-letra="${letra}"]`);
        if (opcionEl) opcionEl.classList.add('seleccionada');
        opcionSeleccionada = letra;
        btnResponder.disabled = false;
    }

    function responder() {
        if (respondida || !opcionSeleccionada) return;
        respondida = true;
        const p = preguntas[indiceActual];
        const esCorrecta = (opcionSeleccionada === p.correcta);
        if (esCorrecta) aciertos++;

        // Mostrar retroalimentación
        feedback.classList.add('mostrar');
        const resultadoTexto = esCorrecta ? '✅ Correcto' : '❌ Incorrecto';
        const claseResultado = esCorrecta ? 'correcto' : 'incorrecto';
        feedbackResultado.innerHTML = `<span class="${claseResultado}">${resultadoTexto}</span> (Respuesta correcta: ${p.correcta})`;
        feedbackJustificacion.textContent = `📘 Justificación: ${p.justificacion}`;
        feedbackDistractores.textContent = `🧩 Análisis de distractores: ${p.distractores}`;

        // Marcar opciones: correcta e incorrecta
        document.querySelectorAll('.opcion').forEach(el => {
            const letra = el.dataset.letra;
            el.classList.remove('seleccionada');
            if (letra === p.correcta) {
                el.classList.add('correcta');
            } else if (letra === opcionSeleccionada && letra !== p.correcta) {
                el.classList.add('incorrecta');
            }
            el.classList.add('deshabilitada');
        });

        btnResponder.disabled = true;
        btnSiguiente.disabled = false;
        actualizarInfo();
    }

    function siguiente() {
        if (indiceActual < preguntas.length - 1) {
            indiceActual++;
            renderPregunta(indiceActual);
        } else {
            // Final del examen
            mostrarResultadoFinal();
        }
    }

    function actualizarInfo() {
        const total = preguntas.length;
        const num = indiceActual + 1;
        progreso.textContent = `${num} / ${total}`;
        aciertosTexto.textContent = `Aciertos: ${aciertos}`;
        preguntaNumero.textContent = `Pregunta ${num} de ${total}`;
    }

    function mostrarResultadoFinal() {
        document.getElementById('preguntaContainer').style.display = 'none';
        document.querySelector('.acciones').style.display = 'none';
        feedback.style.display = 'none';
        document.querySelector('.footer').style.display = 'none';
        resultadoFinal.classList.remove('oculto');
        const porcentaje = Math.round((aciertos / preguntas.length) * 100);
        let mensaje = '';
        if (porcentaje >= 90) mensaje = '🏆 Excelente dominio del diseño conceptual.';
        else if (porcentaje >= 70) mensaje = '📚 Buen conocimiento, revisa algunos conceptos.';
        else if (porcentaje >= 50) mensaje = '📖 Nivel básico; estudia con mayor profundidad.';
        else mensaje = '🔁 Repasa el material completo.';
        resultadoFinal.innerHTML = `
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">📊</div>
            <div>Has respondido <strong>${aciertos}</strong> de ${preguntas.length} preguntas correctamente.</div>
            <div style="font-size:2rem; margin:0.5rem 0;">${porcentaje}%</div>
            <div>${mensaje}</div>
            <button class="btn primario" style="margin-top:1.2rem;" onclick="location.reload()">↻ Reintentar</button>
        `;
    }

    // Event listeners
    btnResponder.addEventListener('click', responder);
    btnSiguiente.addEventListener('click', siguiente);

    // Iniciar
    renderPregunta(0);
</script>
