<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Estudio - Proceso Estándar para Encuestas por Muestreo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 880px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 30px 25px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            color: #0a2a44;
            margin-bottom: 8px;
            border-bottom: 3px solid #1e6f9f;
            padding-bottom: 12px;
        }
        .subtitle {
            color: #2c5282;
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-weight: 500;
            background: #e8f0fe;
            padding: 8px 14px;
            border-radius: 30px;
            display: inline-block;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #e9edf2;
            border-radius: 40px;
            padding: 6px 16px 6px 20px;
        }
        .progress-text {
            font-weight: 600;
            color: #1a3a5e;
        }
        .progress-num {
            background: #1e6f9f;
            color: white;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.9rem;
        }
        .question-box {
            background: #f9fcff;
            border-radius: 14px;
            padding: 22px 20px 18px;
            border: 1px solid #dde7f0;
            min-height: 200px;
        }
        .q-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a6a85;
            background: #dce7f2;
            display: inline-block;
            padding: 2px 14px;
            border-radius: 30px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0b2a44;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 18px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: white;
            border: 1.5px solid #d0dce8;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: border 0.2s, background 0.2s;
        }
        .option:hover {
            border-color: #7fa3c7;
            background: #f0f6fe;
        }
        .option input[type="radio"] {
            margin-top: 3px;
            accent-color: #1e6f9f;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .option label {
            font-size: 1rem;
            color: #1a334a;
            cursor: pointer;
            line-height: 1.4;
            width: 100%;
        }
        .option.correct {
            border-color: #2b7a4b;
            background: #e2f3e6;
        }
        .option.incorrect {
            border-color: #b33c3c;
            background: #fde8e8;
        }
        .option.disabled {
            cursor: default;
            opacity: 0.9;
        }
        .feedback {
            margin-top: 20px;
            background: #f0f4fa;
            border-left: 5px solid #1e6f9f;
            padding: 16px 20px;
            border-radius: 8px;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback .correct-badge {
            color: #1a7a4a;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .feedback .incorrect-badge {
            color: #b33c3c;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .feedback .justification {
            margin-top: 10px;
            font-weight: 500;
            color: #003366;
        }
        .feedback .distractors {
            margin-top: 8px;
            color: #2c3e50;
            font-size: 0.95rem;
            background: #f5f8fc;
            padding: 10px 14px;
            border-radius: 6px;
        }
        .feedback .ref {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #3a5f7a;
            font-style: italic;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .nav-left, .nav-right {
            display: flex;
            gap: 10px;
        }
        button {
            background: white;
            border: 1.5px solid #b0c8dd;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            color: #1a3a5e;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            font-size: 0.95rem;
        }
        button:hover:not(:disabled) {
            background: #e1ecf5;
            border-color: #7fa3c7;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #1e6f9f;
            border-color: #1e6f9f;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #155a83;
            border-color: #155a83;
        }
        .btn-check {
            background: #2b7a4b;
            border-color: #2b7a4b;
            color: white;
        }
        .btn-check:hover:not(:disabled) {
            background: #1f5e3a;
            border-color: #1f5e3a;
        }
        .result-final {
            margin-top: 25px;
            background: #e2edf7;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #0a2a44;
        }
        @media (max-width: 600px) {
            .container { padding: 18px 14px; }
            .q-text { font-size: 1rem; }
            .nav-buttons { flex-direction: column; align-items: stretch; }
            .nav-left, .nav-right { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>📊 Proceso Estándar para Encuestas por Muestreo</h1>
        <div class="subtitle">Autoevaluación · 60 preguntas · INEGI 2010</div>

        <div class="progress-bar">
            <span class="progress-text">Pregunta <span id="currentNum">1</span> de <span id="totalNum">60</span></span>
            <span class="progress-num" id="progressScore">0%</span>
        </div>

        <div class="question-box" id="questionBox">
            <div class="q-type" id="qType">Tipo A</div>
            <div class="q-text" id="qText">Cargando pregunta...</div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback">
                <div id="feedbackHeader"></div>
                <div class="justification" id="justificationText"></div>
                <div class="distractors" id="distractorsText"></div>
                <div class="ref" id="refText"></div>
            </div>
        </div>

        <div class="nav-buttons">
            <div class="nav-left">
                <button id="prevBtn" disabled>◀ Anterior</button>
                <button id="resetBtn">⟳ Reiniciar</button>
            </div>
            <div class="nav-right">
                <button id="checkBtn" class="btn-check">✔ Verificar</button>
                <button id="nextBtn" class="btn-primary">Siguiente ▶</button>
            </div>
        </div>

        <div id="resultContainer" style="display:none;" class="result-final">
            🎯 Has completado la autoevaluación.<br>
            <span id="finalScore">0%</span> de aciertos.
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        //  BASE DE DATOS DE PREGUNTAS (60 preguntas)
        //  basadas en el documento "Proceso Estándar para Encuestas por Muestreo"
        //  páginas 1-33, incluyendo fases, macroactividades y glosario.
        // --------------------------------------------------------------
        const questions = [
            // 1. Definición de proyecto estadístico (glosario) - tipo c
            {
                id: 1,
                tipo: 'c',
                pregunta: 'Según el glosario, un proyecto estadístico es el "Conjunto de actividades ________ y relacionadas para producir o integrar información estadística".',
                opciones: [
                    'ordenadas',
                    'secuenciales',
                    'planificadas',
                    'estandarizadas'
                ],
                respuesta: 0,
                justificacion: 'El glosario define proyecto estadístico como "Conjunto de actividades ordenadas y relacionadas para producir o integrar información estadística" (pág. 32).',
                distractores: 'Secuenciales, planificadas y estandarizadas no son los términos exactos usados en la definición.',
                ref: 'Página 32'
            },
            // 2. Fases del proceso (tipo b - relación)
            {
                id: 2,
                tipo: 'b',
                pregunta: 'Relacione las fases del proceso estándar para encuestas por muestreo con su propósito general (págs. 8-10).\nFases: 1) Planeación, 2) Diseño conceptual, 3) Diseño de la muestra, 4) Captación.\nPropósitos: a) Definir los conceptos y diseñar los instrumentos de captación, b) Determinar el método de muestreo y tamaño de muestra, c) Definir objetivos, estrategia y presupuesto, d) Ejecutar el operativo de recolección de datos.',
                opciones: [
                    '1-c, 2-a, 3-b, 4-d',
                    '1-a, 2-b, 3-c, 4-d',
                    '1-b, 2-c, 3-d, 4-a',
                    '1-d, 2-c, 3-a, 4-b'
                ],
                respuesta: 0,
                justificacion: 'Según las páginas 8-10: Planeación define objetivos y estrategia; Diseño conceptual define conceptos e instrumentos; Diseño de la muestra determina método y tamaño; Captación ejecuta el operativo.',
                distractores: 'Las otras opciones asignan propósitos incorrectos a cada fase.',
                ref: 'Páginas 8-10'
            },
            // 3. Naturaleza de actividades en un proyecto (tipo a)
            {
                id: 3,
                tipo: 'a',
                pregunta: 'Según la descripción general del proceso, ¿qué tipos de actividades interactúan en la generación de estadísticas básicas?',
                opciones: [
                    'Actividades técnicas y administrativas.',
                    'Actividades de campo y de oficina.',
                    'Actividades de muestreo y de censo.',
                    'Actividades de captación y procesamiento.'
                ],
                respuesta: 0,
                justificacion: 'El documento indica: "La generación de estadísticas básicas implica el diseño y ejecución de proyectos donde interactúan actividades tanto de naturaleza técnica, propias del campo estadístico, como administrativas..." (pág. 7).',
                distractores: 'Las otras opciones son subdivisiones o tipos específicos, pero no la categoría general mencionada.',
                ref: 'Página 7'
            },
            // 4. Productos de la planeación (tipo a)
            {
                id: 4,
                tipo: 'a',
                pregunta: '¿Cuál de los siguientes NO es un producto típico de la fase de planeación?',
                opciones: [
                    'Definición de objetivos y estrategia general.',
                    'Programa general de actividades.',
                    'Marco conceptual.',
                    'Presupuesto global.'
                ],
                respuesta: 2,
                justificacion: 'El marco conceptual es un producto del diseño conceptual, no de la planeación. Los productos de la planeación incluyen objetivos, estrategia, programa, estructura organizativa y presupuesto (pág. 8).',
                distractores: 'Los otros son productos de la planeación mencionados en la página 8.',
                ref: 'Página 8'
            },
            // 5. Definición de objetivos y estrategia general - actividades (tipo c)
            {
                id: 5,
                tipo: 'c',
                pregunta: 'La macroactividad "Definición de objetivos y estrategia general" incluye la determinación del tipo de encuesta, la definición de la temática, el establecimiento de la cobertura y desglose geográfico y la definición de la ________.',
                opciones: [
                    'estrategia general',
                    'muestra',
                    'validación',
                    'captación'
                ],
                respuesta: 0,
                justificacion: 'La página 12 enumera las actividades de esta macroactividad: 1.1.1 Determinación del tipo de encuesta, 1.1.2 Definición de la temática, 1.1.3 Establecimiento de la cobertura y desglose geográfico, 1.1.4 Definición de la estrategia general.',
                distractores: 'Muestra, validación y captación son fases posteriores.',
                ref: 'Página 12'
            },
            // 6. Programa general de actividades (tipo a)
            {
                id: 6,
                tipo: 'a',
                pregunta: '¿Qué se incluye en el programa general de actividades según el documento?',
                opciones: [
                    'Solo el calendario de actividades.',
                    'El conjunto de actividades, objetivos específicos, secuencia de operaciones y tiempo requerido para cada una.',
                    'La estructura organizativa y los puestos.',
                    'La estimación de costos y fuentes de financiamiento.'
                ],
                respuesta: 1,
                justificacion: 'La página 13 describe: "Comprende el conjunto de actividades, los objetivos específicos, la secuencia de operaciones y el tiempo requerido para cada una de ellas."',
                distractores: 'Las otras opciones corresponden a otras macroactividades (control, organización, presupuesto).',
                ref: 'Página 13'
            },
            // 7. Determinación de la estructura de organización (tipo a)
            {
                id: 7,
                tipo: 'a',
                pregunta: '¿Cuál es el propósito de la determinación de la estructura de organización?',
                opciones: [
                    'Establecer las funciones a cubrir y la estructura organizativa para su atención.',
                    'Definir los objetivos del proyecto.',
                    'Calcular el tamaño de la muestra.',
                    'Diseñar los instrumentos de captación.'
                ],
                respuesta: 0,
                justificacion: 'La página 13 indica: "De acuerdo con las necesidades de diseño y ejecución de la encuesta, se establecerán las funciones a cubrirse, así como la estructura organizativa para su atención..."',
                distractores: 'Las otras opciones corresponden a otras fases.',
                ref: 'Página 13'
            },
            // 8. Presupuestación global (tipo c)
            {
                id: 8,
                tipo: 'c',
                pregunta: 'La presupuestación global incluye la estimación del costo de la encuesta por cada fase y tipo de recursos, las fuentes de financiamiento y el ________ del presupuesto de inicio a término del proyecto.',
                opciones: [
                    'ejercicio',
                    'control',
                    'seguimiento',
                    'ajuste'
                ],
                respuesta: 0,
                justificacion: 'La página 13 dice: "...la presupuestación global del proyecto, en la que se estima el costo de la encuesta por cada fase y tipo de recursos, las fuentes de financiamiento y el ejercicio del presupuesto de inicio a término del proyecto."',
                distractores: 'Control, seguimiento y ajuste son actividades posteriores al ejercicio presupuestal.',
                ref: 'Página 13'
            },
            // 9. Control administrativo - definición (tipo b - relación)
            {
                id: 9,
                tipo: 'b',
                pregunta: 'Relacione los conceptos de control con su definición según el glosario (págs. 35-37).\nConceptos: 1) Control administrativo, 2) Control de avance, 3) Control de calidad en el llenado del cuestionario, 4) Control del operativo.\nDefiniciones: a) Medición y análisis de resultados con relación a metas y tiempos programados. b) Aseguramiento de que las actividades se lleven a cabo en tiempos programados y con calidad esperada. c) Conjunto de procedimientos de registro, análisis y evaluación de actividades. d) Medición y análisis de los resultados en los cuestionarios aplicados, con base en criterios de validación.',
                opciones: [
                    '1-c, 2-a, 3-d, 4-b',
                    '1-a, 2-b, 3-c, 4-d',
                    '1-b, 2-d, 3-a, 4-c',
                    '1-d, 2-c, 3-b, 4-a'
                ],
                respuesta: 0,
                justificacion: 'Según el glosario: Control administrativo = procedimientos de registro, análisis y evaluación; Control de avance = medición con relación a metas y tiempos; Control de calidad en llenado = medición de resultados en cuestionarios; Control del operativo = aseguramiento de actividades en tiempos y calidad.',
                distractores: 'Las otras combinaciones asignan definiciones incorrectas.',
                ref: 'Páginas 35-37'
            },
            // 10. Diseño conceptual - actividades (tipo a)
            {
                id: 10,
                tipo: 'a',
                pregunta: '¿Cuál de las siguientes NO es una actividad de la fase de diseño conceptual?',
                opciones: [
                    'Identificación de necesidades e integración del marco conceptual.',
                    'Diseño del esquema para la presentación de resultados.',
                    'Determinación del método de muestreo.',
                    'Diseño y prueba de instrumentos de captación.'
                ],
                respuesta: 2,
                justificacion: 'La determinación del método de muestreo corresponde a la fase 3 (Diseño de la Muestra). Las otras son macroactividades de la fase 2 (págs. 15-18).',
                distractores: 'Las otras tres son macroactividades del diseño conceptual.',
                ref: 'Páginas 15-18'
            },
            // 11. Integración del marco conceptual (tipo c)
            {
                id: 11,
                tipo: 'c',
                pregunta: 'El marco conceptual incluye la definición de temas, categorías, variables y sus ________.',
                opciones: [
                    'clasificaciones',
                    'indicadores',
                    'relaciones',
                    'códigos'
                ],
                respuesta: 0,
                justificacion: 'La página 16 indica: "Los conceptos que serán incluidos en el marco conceptual son: Temas, Categorías, Variables, Clasificaciones."',
                distractores: 'Indicadores, relaciones y códigos son elementos derivados o de otras fases.',
                ref: 'Página 16'
            },
            // 12. Definición de conceptos e integración del glosario (tipo a)
            {
                id: 12,
                tipo: 'a',
                pregunta: '¿Cuál es la utilidad del glosario integrado en el marco conceptual?',
                opciones: [
                    'Apoyar el diseño de instrumentos de captación y el tratamiento de datos durante el procesamiento.',
                    'Servir como lista de verificación para la muestra.',
                    'Definir los criterios de validación.',
                    'Establecer el presupuesto del proyecto.'
                ],
                respuesta: 0,
                justificacion: 'La página 16 dice: "El marco conceptual y las definiciones de los conceptos involucrados se concentran en un documento que permitirá apoyar el proceso hasta su culminación. Es una herramienta útil tanto en el diseño de los instrumentos de captación como para el tratamiento de los datos durante su procesamiento..."',
                distractores: 'Las otras opciones no son funciones del glosario.',
                ref: 'Página 16'
            },
            // 13. Diseño del esquema para la presentación de resultados (tipo a)
            {
                id: 13,
                tipo: 'a',
                pregunta: '¿Qué se determina en la macroactividad "Diseño del esquema para la presentación de resultados"?',
                opciones: [
                    'Los contenidos, formas y medios de presentación de los resultados.',
                    'Los criterios de validación de los datos.',
                    'El tamaño de la muestra.',
                    'Los instrumentos de captación.'
                ],
                respuesta: 0,
                justificacion: 'La página 16 dice: "En esta macroactividad se determinan de manera general los contenidos, formas y medios en que se presentan los resultados..."',
                distractores: 'Las otras opciones corresponden a otras macroactividades.',
                ref: 'Página 16'
            },
            // 14. Diseño y prueba de instrumentos de captación (tipo b - relación)
            {
                id: 14,
                tipo: 'b',
                pregunta: 'Relacione las actividades del diseño y prueba de instrumentos de captación con su propósito (págs. 16-18).\nActividades: 1) Redacción de preguntas, 2) Ordenamiento de preguntas, 3) Determinación del tipo de formato, 4) Pruebas y ajustes.\nPropósitos: a) Decidir entre formato impreso o electrónico y sus características, b) Verificar la efectividad del instrumento en condiciones similares a las reales, c) Elaborar enunciados claros y directos para cada variable, d) Agrupar temáticamente y usar pases o saltos para facilitar el llenado.',
                opciones: [
                    '1-c, 2-d, 3-a, 4-b',
                    '1-d, 2-c, 3-b, 4-a',
                    '1-a, 2-b, 3-c, 4-d',
                    '1-b, 2-a, 3-d, 4-c'
                ],
                respuesta: 0,
                justificacion: 'Según las páginas 16-18: Redacción de preguntas = elaborar enunciados claros; Ordenamiento = agrupar temáticamente y usar pases; Determinación del tipo de formato = decidir entre impreso/electrónico; Pruebas = verificar efectividad en condiciones similares.',
                distractores: 'Las otras combinaciones no corresponden a las descripciones.',
                ref: 'Páginas 16-18'
            },
            // 15. Criterios de validación (tipo a)
            {
                id: 15,
                tipo: 'a',
                pregunta: '¿Qué se hace en la definición de criterios de validación?',
                opciones: [
                    'Identificar datos que cumplen con requisitos de congruencia lógica y aritmética, completez e integridad.',
                    'Diseñar los instrumentos de captación.',
                    'Calcular el tamaño de la muestra.',
                    'Establecer el presupuesto.'
                ],
                respuesta: 0,
                justificacion: 'La página 18 define: "Conjunto de actividades para identificar, en la información captada, los datos que cumplen con los requisitos de congruencia lógica y aritmética, completez e integridad..."',
                distractores: 'Las otras opciones corresponden a otras fases.',
                ref: 'Página 18'
            },
            // 16. Determinación del método de muestreo (tipo a)
            {
                id: 16,
                tipo: 'a',
                pregunta: '¿Qué se debe analizar para determinar el método de muestreo?',
                opciones: [
                    'La población objetivo y el tipo de datos a captar.',
                    'Los objetivos del proyecto y la cobertura geográfica.',
                    'Los recursos presupuestales disponibles.',
                    'Los criterios de validación.'
                ],
                respuesta: 0,
                justificacion: 'La página 19 dice: "Dependiendo de la población objetivo y tipo de datos a captarse, se establece la modalidad metodológica a aplicar y los procedimientos de selección."',
                distractores: 'Los otros elementos son consideraciones para el diseño de la muestra, pero la base es la población y tipo de datos.',
                ref: 'Página 19'
            },
            // 17. Muestreo probabilístico vs no probabilístico (tipo a)
            {
                id: 17,
                tipo: 'a',
                pregunta: '¿Cuál es la principal diferencia entre el muestreo probabilístico y el no probabilístico?',
                opciones: [
                    'En el probabilístico se conoce la probabilidad de selección y la precisión de las estimaciones; en el no probabilístico no se conoce.',
                    'El probabilístico usa marcos muestrales, el no probabilístico no.',
                    'El probabilístico es más caro que el no probabilístico.',
                    'El no probabilístico siempre es más preciso.'
                ],
                respuesta: 0,
                justificacion: 'La página 19 indica: "En el muestreo probabilístico se conoce la probabilidad de selección de cada una de las unidades de muestra, y por lo tanto la precisión de las estimaciones;... en el muestreo no probabilístico no se puede conocer la precisión en las estimaciones."',
                distractores: 'Las otras opciones no son diferencias fundamentales establecidas en el texto.',
                ref: 'Página 19'
            },
            // 18. Preparación del marco muestral (tipo c)
            {

            // 60. Definición de glosario: Variable (tipo c)

        // --------------------------------------------------------------
        //  LÓGICA DE LA APLICACIÓN
        // --------------------------------------------------------------
        let currentIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let verified = new Array(questions.length).fill(false);
        let selectedOptionIndex = null;

        const qTypeEl = document.getElementById('qType');
        const qTextEl = document.getElementById('qText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackEl = document.getElementById('feedback');
        const feedbackHeader = document.getElementById('feedbackHeader');
        const justificationText = document.getElementById('justificationText');
        const distractorsText = document.getElementById('distractorsText');
        const refText = document.getElementById('refText');
        const currentNum = document.getElementById('currentNum');
        const totalNum = document.getElementById('totalNum');
        const progressScore = document.getElementById('progressScore');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const checkBtn = document.getElementById('checkBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultContainer = document.getElementById('resultContainer');
        const finalScore = document.getElementById('finalScore');

        totalNum.textContent = questions.length;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Barajar opciones para cada pregunta
        const shuffledData = questions.map(q => {
            const opts = q.opciones.map((text, idx) => ({ text, idx }));
            const shuffled = shuffleArray([...opts]);
            const newOptions = shuffled.map(item => item.text);
            const newAnswerIndex = shuffled.findIndex(item => item.idx === q.respuesta);
            return {
                ...q,
                opciones: newOptions,
                respuesta: newAnswerIndex
            };
        });

        function renderQuestion(index) {
            const q = shuffledData[index];
            qTypeEl.textContent = `Tipo ${q.tipo.toUpperCase()}`;
            qTextEl.textContent = q.pregunta;
            optionsContainer.innerHTML = '';
            feedbackEl.classList.remove('show');

            q.opciones.forEach((text, idx) => {
                const div = document.createElement('div');
                div.className = 'option';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'question';
                radio.value = idx;
                radio.id = `opt_${idx}`;
                const label = document.createElement('label');
                label.htmlFor = `opt_${idx}`;
                label.textContent = text;
                div.appendChild(radio);
                div.appendChild(label);
                optionsContainer.appendChild(div);

                if (answers[index] === idx) {
                    radio.checked = true;
                }
                if (verified[index]) {
                    radio.disabled = true;
                    div.classList.add('disabled');
                    if (idx === q.respuesta) {
                        div.classList.add('correct');
                    } else if (answers[index] === idx && idx !== q.respuesta) {
                        div.classList.add('incorrect');
                    }
                }

                radio.addEventListener('change', (e) => {
                    if (!verified[index]) {
                        selectedOptionIndex = parseInt(e.target.value);
                        answers[index] = selectedOptionIndex;
                    }
                });
            });

            if (verified[index]) {
                showFeedback(index);
            }

            currentNum.textContent = index + 1;
            updateProgress();

            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questions.length - 1;
            checkBtn.disabled = verified[index];

            resultContainer.style.display = 'none';
        }

        function showFeedback(index) {
            const q = shuffledData[index];
            const isCorrect = answers[index] === q.respuesta;
            feedbackEl.classList.add('show');
            feedbackHeader.innerHTML = isCorrect
                ? '<span class="correct-badge">✅ Correcto</span>'
                : '<span class="incorrect-badge">❌ Incorrecto</span>';
            justificationText.textContent = '🔍 ' + q.justificacion;
            distractorsText.textContent = '📌 Análisis de distractores: ' + q.distractores;
            refText.textContent = '📖 Referencia: ' + q.ref;
        }

        function updateProgress() {
            const answered = answers.filter(a => a !== null).length;
            const pct = Math.round((answered / questions.length) * 100);
            progressScore.textContent = pct + '%';
        }

        function checkAnswer() {
            const index = currentIndex;
            const q = shuffledData[index];
            if (answers[index] === null || answers[index] === undefined) {
                alert('Selecciona una opción antes de verificar.');
                return;
            }
            verified[index] = true;
            const options = document.querySelectorAll('.option');
            options.forEach((div, idx) => {
                const radio = div.querySelector('input[type="radio"]');
                radio.disabled = true;
                div.classList.add('disabled');
                if (idx === q.respuesta) {
                    div.classList.add('correct');
                } else if (answers[index] === idx && idx !== q.respuesta) {
                    div.classList.add('incorrect');
                }
            });
            checkBtn.disabled = true;
            showFeedback(index);
            updateProgress();

            if (verified.every(v => v === true)) {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const correctas = shuffledData.filter((q, idx) => answers[idx] === q.respuesta).length;
            const total = questions.length;
            const pct = Math.round((correctas / total) * 100);
            finalScore.textContent = pct + '% (' + correctas + '/' + total + ')';
            resultContainer.style.display = 'block';
        }

        function goTo(index) {
            if (index < 0 || index >= questions.length) return;
            currentIndex = index;
            renderQuestion(index);
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goTo(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < questions.length - 1) goTo(currentIndex + 1);
        });

        checkBtn.addEventListener('click', checkAnswer);

        resetBtn.addEventListener('click', () => {
            if (confirm('¿Reiniciar todas las respuestas?')) {
                answers.fill(null);
                verified.fill(false);
                resultContainer.style.display = 'none';
                goTo(0);
                updateProgress();
                checkBtn.disabled = false;
            }
        });

        renderQuestion(0);
    </script>
