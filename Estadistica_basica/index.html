            flex-wrap: wrap;

            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;

            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;

</head>

// =================== LÓGICA DEL EXAMEN ===================
let indiceActual = 0;
let aciertos = 0;
let respondida = false;
let opcionSeleccionada = null;

const preguntaTexto = document.getElementById('preguntaTexto');
const opcionesContainer = document.getElementById('opcionesContainer');
const btnResponder = document.getElementById('btnResponder');
const btnSiguiente = document.getElementById('btnSiguiente');
const feedback = document.getElementById('feedback');
const feedbackResultado = document.getElementById('feedbackResultado');
const feedbackJustificacion = document.getElementById('feedbackJustificacion');
const feedbackDistractores = document.getElementById('feedbackDistractores');
const progreso = document.getElementById('progreso');
const aciertosTexto = document.getElementById('aciertosTexto');
const preguntaNumero = document.getElementById('preguntaNumero');
const resultadoFinal = document.getElementById('resultadoFinal');

function renderPregunta(index) {
    const p = preguntas[index];
    preguntaTexto.textContent = `${index+1}. ${p.texto}`;
    const letras = ['A', 'B', 'C', 'D'];
    opcionesContainer.innerHTML = '';
    letras.forEach(letra => {
        const div = document.createElement('div');
        div.className = 'opcion';
        div.dataset.letra = letra;
        div.innerHTML = `<span class="letra">${letra}.</span> ${p.opciones[letra]}`;
        div.addEventListener('click', () => seleccionarOpcion(letra));
        opcionesContainer.appendChild(div);
    });

    respondida = false;
    opcionSeleccionada = null;
    btnResponder.disabled = true;
    btnSiguiente.disabled = true;
    feedback.classList.remove('mostrar');
    document.querySelectorAll('.opcion').forEach(el => {
        el.classList.remove('seleccionada', 'correcta', 'incorrecta', 'deshabilitada');
    });

    actualizarInfo();
}

function seleccionarOpcion(letra) {
    if (respondida) return;
    document.querySelectorAll('.opcion').forEach(el => el.classList.remove('seleccionada'));
    const opcionEl = document.querySelector(`.opcion[data-letra="${letra}"]`);
    if (opcionEl) opcionEl.classList.add('seleccionada');
    opcionSeleccionada = letra;
    btnResponder.disabled = false;
}

function responder() {
    if (respondida || !opcionSeleccionada) return;
    respondida = true;
    const p = preguntas[indiceActual];
    const esCorrecta = (opcionSeleccionada === p.correcta);
    if (esCorrecta) aciertos++;

    feedback.classList.add('mostrar');
    const resultadoTexto = esCorrecta ? '✅ Correcto' : '❌ Incorrecto';
    const claseResultado = esCorrecta ? 'correcto' : 'incorrecto';
    feedbackResultado.innerHTML = `<span class="${claseResultado}">${resultadoTexto}</span> (Respuesta correcta: ${p.correcta})`;
    feedbackJustificacion.textContent = `📘 Justificación: ${p.justificacion}`;
    feedbackDistractores.textContent = `🧩 Análisis de distractores: ${p.distractores}`;

    document.querySelectorAll('.opcion').forEach(el => {
        const letra = el.dataset.letra;
        el.classList.remove('seleccionada');
        if (letra === p.correcta) {
            el.classList.add('correcta');
        } else if (letra === opcionSeleccionada && letra !== p.correcta) {
            el.classList.add('incorrecta');
        }
        el.classList.add('deshabilitada');
    });

    btnResponder.disabled = true;
    btnSiguiente.disabled = false;
    actualizarInfo();
}

function siguiente() {
    if (indiceActual < preguntas.length - 1) {
        indiceActual++;
        renderPregunta(indiceActual);
    } else {
        mostrarResultadoFinal();
    }
}

function actualizarInfo() {
    const total = preguntas.length;
    const num = indiceActual + 1;
    progreso.textContent = `${num} / ${total}`;
    aciertosTexto.textContent = `Aciertos: ${aciertos}`;
    preguntaNumero.textContent = `Pregunta ${num} de ${total}`;
}

function mostrarResultadoFinal() {
    document.getElementById('preguntaContainer').style.display = 'none';
    document.querySelector('.acciones').style.display = 'none';
    feedback.style.display = 'none';
    document.querySelector('.footer').style.display = 'none';
    resultadoFinal.classList.remove('oculto');
    const porcentaje = Math.round((aciertos / preguntas.length) * 100);
    let mensaje = '';
    if (porcentaje >= 90) mensaje = '🏆 Excelente dominio del tema.';
    else if (porcentaje >= 70) mensaje = '📚 Buen conocimiento, revisa algunos conceptos.';
    else if (porcentaje >= 50) mensaje = '📖 Nivel básico; estudia con mayor profundidad.';
    else mensaje = '🔁 Repasa el material completo.';
    resultadoFinal.innerHTML = `
        <div style="font-size:2.5rem; margin-bottom:0.5rem;">📊</div>
        <div>Has respondido <strong>${aciertos}</strong> de ${preguntas.length} preguntas correctamente.</div>
        <div style="font-size:2rem; margin:0.5rem 0;">${porcentaje}%</div>
        <div>${mensaje}</div>
        <button class="btn primario" style="margin-top:1.2rem;" onclick="location.reload()">↻ Reintentar</button>
    `;
}

btnResponder.addEventListener('click', responder);
btnSiguiente.addEventListener('click', siguiente);

renderPregunta(0);
</script>
