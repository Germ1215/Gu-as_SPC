<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de autoevaluación - Ley SNIEG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.10);
            padding: 30px 32px;
            transition: 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0a2a44;
            border-left: 6px solid #1a6ed8;
            padding-left: 18px;
            margin-bottom: 6px;
        }
        .sub {
            color: #2f5577;
            font-size: 0.95rem;
            padding-left: 24px;
            border-bottom: 1px solid #e0e7ef;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .progress {
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 6px 0 16px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #1a6ed8;
            width: 0%;
            transition: width 0.2s;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .q-counter {
            background: #eef2f7;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a3a5a;
        }
        .q-status {
            font-size: 0.9rem;
            color: #4a6a8a;
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0a1e32;
            margin: 14px 0 18px 0;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 18px 0;
        }
        .opt-label {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f9fbfd;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.1s, border 0.1s;
            font-size: 1rem;
        }
        .opt-label:hover {
            background: #f0f4fe;
            border-color: #b3cbf5;
        }
        .opt-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a6ed8;
            flex-shrink: 0;
            margin: 0;
        }
        .opt-label.selected {
            background: #e6effb;
            border-color: #1a6ed8;
        }
        .opt-label.correct-highlight {
            background: #dff0d8;
            border-color: #2e8b57;
        }
        .opt-label.wrong-highlight {
            background: #f8d7da;
            border-color: #b02a37;
        }
        .feedback {
            background: #f0f4fa;
            border-radius: 16px;
            padding: 18px 22px;
            margin: 16px 0 18px 0;
            border-left: 5px solid #1a6ed8;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback .badge-correct {
            color: #0d6e2b;
            font-weight: 600;
        }
        .feedback .badge-wrong {
            color: #b02a37;
            font-weight: 600;
        }
        .feedback .justify {
            margin-top: 8px;
            font-size: 0.96rem;
            line-height: 1.5;
        }
        .feedback .distractor {
            margin-top: 8px;
            font-size: 0.92rem;
            background: #e9eef3;
            padding: 8px 14px;
            border-radius: 10px;
            color: #1f3a57;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1a2d44;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #1a6ed8;
            border-color: #1a6ed8;
            color: white;
        }
        .btn-primary:hover {
            background: #135bb5;
            border-color: #135bb5;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-success {
            background: #1f8b4c;
            border-color: #1f8b4c;
            color: white;
        }
        .btn-success:hover {
            background: #17733e;
        }
        .results {
            background: #e8f0fe;
            border-radius: 20px;
            padding: 18px 24px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #0b2b4a;
        }
        .relacion-lista {
            background: #f5f8fc;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 8px 0 12px 0;
            font-size: 0.95rem;
            border-left: 3px solid #1a6ed8;
        }
        .relacion-lista span {
            display: inline-block;
            margin-right: 18px;
        }
        @media (max-width: 600px) {
            .container { padding: 18px 16px; }
            .nav { flex-direction: column; align-items: stretch; }
            .nav-buttons { justify-content: center; flex-wrap: wrap; }
            .btn { padding: 8px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📘 Ley del SNIEG</h1>
    <div class="sub">Autoevaluación · Artículos seleccionados</div>

    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

    <div id="questionArea">
        <div class="q-header">
            <span class="q-counter" id="qCounter">Pregunta 1 / 50</span>
            <span class="q-status" id="qStatus">● Sin responder</span>
        </div>
        <div class="q-text" id="qText">Cargando pregunta...</div>
        <div id="relacionList" class="relacion-lista" style="display:none;"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedbackBox">
            <div id="feedbackContent"></div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-buttons">
            <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
            <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="checkBtn">✔ Verificar</button>
            <button class="btn btn-success" id="resetBtn">⟳ Reiniciar</button>
        </div>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="results" id="resultsContent"></div>
    </div>
</div>

<script>
// --------------------------------------------------------------
// 50 PREGUNTAS basadas en la Ley SNIEG (artículos especificados)
// Tipos: a) distractores, b) relación, c) completar
// --------------------------------------------------------------
const questions = [
    // 1. Art. 3 - principios rectores
    {
        type: 'c',
        text: 'Los principios rectores del Sistema Nacional de Información Estadística y Geográfica son accesibilidad, transparencia, objetividad e ______.',
        options: [
            'A) independencia',
            'B) confidencialidad',
            'C) oportunidad',
            'D) veracidad'
        ],
        correct: 'A',
        justification: 'Artículo 3: "Serán principios rectores del Sistema los de accesibilidad, transparencia, objetividad e independencia."',
        distractors: 'B) confidencialidad es un principio para los datos, no del Sistema; C) oportunidad es una característica de la información, no principio rector; D) veracidad es cualidad de la información, no principio rector.'
    },
    // 2. Art. 4 - objetivos del Sistema
    {
        type: 'a',
        text: '¿Cuál de los siguientes NO es un objetivo del Sistema Nacional de Información Estadística y Geográfica según el artículo 4?',
        options: [
            'A) Producir Información',
            'B) Difundir oportunamente la Información',
            'C) Promover el conocimiento y uso de la Información',
            'D) Sancionar a los informantes que no proporcionen datos'
        ],
        correct: 'D',
        justification: 'Artículo 4: los objetivos son I. Producir Información; II. Difundir oportunamente la Información; III. Promover el conocimiento y uso de la Información; IV. Conservar la Información. La sanción es un tema del Título Cuarto (faltas administrativas), no un objetivo del Sistema.',
        distractors: 'A, B y C son objetivos explícitos del artículo 4.'
    },
    // 3. Art. 2 - definición de Información Estadística
    {
        type: 'c',
        text: 'La Información Estadística se define como el conjunto de resultados cuantitativos o datos que se obtienen de las Actividades Estadísticas y Geográficas en materia estadística, tomando como base los datos primarios obtenidos de los ______.',
        options: [
            'A) Informantes del Sistema',
            'B) registros administrativos',
            'C) censos nacionales',
            'D) encuestas nacionales'
        ],
        correct: 'A',
        justification: 'Artículo 2, fracción III: "...tomando como base los datos primarios obtenidos de los Informantes del Sistema sobre hechos que son relevantes..."',
        distractors: 'B) los registros administrativos son una fuente, pero la definición se refiere a los Informantes; C) los censos son un tipo de actividad; D) las encuestas son otro instrumento.'
    },
    // 4. Art. 2 - definición de Información Geográfica
    {
        type: 'a',
        text: 'La Información Geográfica es el conjunto organizado de datos espaciales georreferenciados, que mediante símbolos y códigos genera conocimiento acerca de:',
        options: [
            'A) las condiciones físico-ambientales, recursos naturales y obras de naturaleza antrópica del territorio nacional',
            'B) los fenómenos económicos, demográficos y sociales',
            'C) la gestión y desempeño de las instituciones públicas',
            'D) los indicadores de gobierno y seguridad pública'
        ],
        correct: 'A',
        justification: 'Artículo 2, fracción IV: "...genera el conocimiento acerca de las condiciones físico-ambientales, de los recursos naturales y de las obras de naturaleza antrópica del territorio nacional."',
        distractors: 'B) corresponde a Información Estadística; C) y D) son temas del Subsistema de Gobierno, Seguridad Pública e Impartición de Justicia.'
    },
    // 5. Art. 5 - integración del Sistema
    {
        type: 'b',
        text: 'Relacione los elementos que integran el Sistema Nacional de Información Estadística y Geográfica según el artículo 5:',
        options: [
            'A) 1-C, 2-B, 3-A',
            'B) 1-A, 2-C, 3-B',
            'C) 1-B, 2-A, 3-C',
            'D) 1-C, 2-A, 3-B'
        ],
        correct: 'A',
        justification: 'Artículo 5: I. El Consejo Consultivo Nacional (C); II. Los Subsistemas Nacionales de Información (B); III. El Instituto (A).',
        distractors: 'Las otras opciones confunden los roles del Consejo, los Subsistemas y el Instituto.',
        relacionItems: '1) Consejo Consultivo Nacional  2) Subsistemas Nacionales de Información  3) Instituto',
        relacionOpciones: 'A) INEGI   B) Subsistemas   C) Consejo Consultivo'
    },
    // 6. Art. 7 - organización y coordinación
    {
        type: 'c',
        text: 'La organización, planeación, funcionamiento y coordinación de las Actividades Estadísticas y Geográficas se sujetarán a esta Ley, a los programas previstos en el artículo 9 y a las disposiciones de carácter general que expida el ______.',
        options: [
            'A) Consejo Consultivo Nacional',
            'B) Instituto',
            'C) Presidente de la República',
            'D) Congreso de la Unión'
        ],
        correct: 'B',
        justification: 'Artículo 7: "...se sujetarán a esta Ley, a los programas previstos en el artículo 9 de esta Ley y a las disposiciones de carácter general que expida al efecto el Instituto..."',
        distractors: 'A) el Consejo es consultivo; C) el Presidente no expide esas disposiciones; D) el Congreso expide leyes, no disposiciones generales del Sistema.'
    },
    // 7. Art. 8 - participación de las Unidades
    {
        type: 'a',
        text: 'Las Unidades del Estado participan en el Sistema a través de los siguientes órganos, EXCEPTO:',
        options: [
            'A) El Consejo Consultivo Nacional',
            'B) Los Comités Ejecutivos de los Subsistemas',
            'C) Los Comités Técnicos Especializados',
            'D) La Junta de Gobierno del Instituto'
        ],
        correct: 'D',
        justification: 'Artículo 8: las Unidades participan a través de I. El Consejo Consultivo Nacional; II. Los Comités Ejecutivos; III. Los Comités Técnicos Especializados. La Junta de Gobierno es el órgano superior de dirección del Instituto, no un órgano de participación de las Unidades.',
        distractors: 'A, B y C son los órganos señalados en el artículo 8.'
    },
    // 8. Art. 17 - Subsistemas Nacionales
    {
        type: 'c',
        text: 'El Sistema contará con los siguientes Subsistemas Nacionales de Información: Demográfica y Social; Económica; Geográfica y del Medio Ambiente; y ______.',
        options: [
            'A) de Gobierno, Seguridad Pública e Impartición de Justicia',
            'B) de Gobierno y Seguridad Pública',
            'C) de Impartición de Justicia',
            'D) de Gobierno'
        ],
        correct: 'A',
        justification: 'Artículo 17, fracción IV: "Gobierno, Seguridad Pública e Impartición de Justicia". La reforma de 2018 adicionó este Subsistema.',
        distractors: 'B) omite Impartición de Justicia; C) omite Gobierno y Seguridad Pública; D) es incompleto.'
    },
    // 9. Art. 18 - acuerdo de creación de Subsistema
    {
        type: 'a',
        text: 'En el acuerdo de creación de un Subsistema, la Junta de Gobierno deberá señalar como mínimo su infraestructura de información, los indicadores clave y:',
        options: [
            'A) las fuentes de las que se obtendrá la información básica',
            'B) el presupuesto asignado',
            'C) los miembros del Comité Ejecutivo',
            'D) el calendario de publicación'
        ],
        correct: 'A',
        justification: 'Artículo 18: "...deberá señalar como mínimo su infraestructura de información, los indicadores clave que deberá producir y las fuentes de las que se obtendrá... la información básica para dichos indicadores."',
        distractors: 'B) el presupuesto no se menciona en ese artículo; C) los miembros del Comité se definen en otros artículos; D) el calendario es un asunto de publicación, no de creación.'
    },
    // 10. Art. 19 - partes de los Subsistemas
    {
        type: 'b',
        text: 'Relacione los componentes que forman parte de los Subsistemas según el artículo 19:',
        options: [
            'A) 1-C, 2-A, 3-B',
            'B) 1-A, 2-B, 3-C',
            'C) 1-B, 2-C, 3-A',
            'D) 1-C, 2-B, 3-A'
        ],
        correct: 'A',
        justification: 'Artículo 19: forman parte de los Subsistemas: los Comités Ejecutivos (C), los Comités Técnicos Especializados (A) y las Unidades del Estado (B).',
        distractors: 'Las otras opciones confunden el orden o los roles.',
        relacionItems: '1) Comités Ejecutivos  2) Comités Técnicos Especializados  3) Unidades del Estado',
        relacionOpciones: 'A) Comités Técnicos Especializados   B) Unidades del Estado   C) Comités Ejecutivos'
    },
    // 11. Art. 28 - elaboración de indicadores del Subsistema Geográfico y del Medio Ambiente
    {
        type: 'c',
        text: 'El Instituto elaborará los indicadores del Subsistema Nacional de Información Geográfica y del Medio Ambiente a partir de la información básica proveniente del Sistema Nacional de Información Ambiental y de Recursos Naturales, de un sistema integrado de inventarios y encuestas, y de ______.',
        options: [
            'A) los registros administrativos',
            'B) los censos económicos',
            'C) las cuentas nacionales',
            'D) los índices de precios'
        ],
        correct: 'A',
        justification: 'Artículo 28, fracción III: "Los registros administrativos que permitan obtener Información en la materia."',
        distractors: 'B) los censos económicos pertenecen al Subsistema Económico; C) las cuentas nacionales son facultad exclusiva del INEGI; D) los índices de precios son facultad exclusiva del INEGI.'
    },
    // 12. Art. 52 - naturaleza del INEGI
    {
        type: 'a',
        text: 'El Instituto Nacional de Estadística y Geografía es un organismo público con autonomía técnica y de gestión, personalidad jurídica y patrimonio propios, responsable de normar y coordinar el Sistema, así como de realizar las Actividades a que se refiere el artículo ______.',
        options: [
            'A) 59',
            'B) 55',
            'C) 77',
            'D) 81'
        ],
        correct: 'A',
        justification: 'Artículo 52: "...responsable de normar y coordinar el Sistema Nacional de Información Estadística y Geográfica, así como de realizar las Actividades a que se refiere el artículo 59 de esta Ley."',
        distractors: 'B) artículo 55 funciones generales; C) artículo 77 atribuciones de la Junta de Gobierno; D) artículo 81 atribuciones del Presidente.'
    },
    // 13. Art. 53 - objetivo prioritario del INEGI
    {
        type: 'c',
        text: 'El Instituto tendrá como objetivo prioritario realizar las acciones tendientes a lograr que la Información de Interés Nacional se sujete a los principios enunciados en el artículo ______.',
        options: [
            'A) 2',
            'B) 3',
            'C) 4',
            'D) 5'
        ],
        correct: 'B',
        justification: 'Artículo 53: "...realizar las acciones tendientes a lograr que la Información de Interés Nacional se sujete a los principios enunciados en el artículo 3 de esta Ley."',
        distractors: 'A) artículo 2 definiciones; C) artículo 4 objetivos del Sistema; D) artículo 5 integración del Sistema.'
    },
    // 14. Art. 54 - acciones del INEGI
    {
        type: 'a',
        text: 'El Instituto, conforme a los principios constitucionales que rigen al Sistema, realizará acciones tendientes a lograr la adecuación conceptual de la Información a las necesidades del desarrollo, que la Información sea comparable en el tiempo y en el espacio, y:',
        options: [
            'A) la adecuación de los procedimientos estadísticos y geográficos a estándares internacionales',
            'B) la difusión gratuita de toda la información',
            'C) la sanción a los informantes que no cooperen',
            'D) la elaboración de los índices nacionales de precios'
        ],
        correct: 'A',
        justification: 'Artículo 54, fracción III: "La adecuación de los procedimientos estadísticos y geográficos a estándares internacionales, para facilitar su comparación."',
        distractors: 'B) no es una acción del artículo 54; C) corresponde a faltas administrativas; D) es una facultad exclusiva del artículo 59.'
    },
    // 15. Art. 55 - funciones del Instituto como unidad coordinadora
    {
        type: 'b',
        text: 'Relacione las funciones del Instituto como unidad central coordinadora del Sistema según el artículo 55:',
        options: [
            'A) 1-C, 2-B, 3-A',
            'B) 1-A, 2-C, 3-B',
            'C) 1-B, 2-A, 3-C',
            'D) 1-C, 2-A, 3-B'
        ],
        correct: 'A',
        justification: 'Artículo 55: I. Normar y coordinar el Sistema (C); II. Normar y coordinar las Actividades de las Unidades (B); III. Solicitar a las Unidades información para la integración de los programas (A).',
        distractors: 'Las otras opciones invierten el orden de las funciones.',
        relacionItems: '1) Normar y coordinar el Sistema  2) Normar y coordinar las Actividades de las Unidades  3) Solicitar información para programas',
        relacionOpciones: 'A) Solicitar información para programas   B) Normar y coordinar Actividades de Unidades   C) Normar y coordinar el Sistema'
    },
    // 16. Art. 56 - catálogo nacional de indicadores
    {
        type: 'c',
        text: 'El Instituto establecerá en coordinación con las Unidades un catálogo nacional de indicadores, ajustándose a lo dispuesto en los artículos 22, 25 y ______ de esta Ley.',
        options: [
            'A) 28',
            'B) 26',
            'C) 27',
            'D) 29'
        ],
        correct: 'A',
        justification: 'Artículo 56: "...ajustándose a lo dispuesto en los artículos 22, 25 y 28 de esta Ley." (corresponden a los Subsistemas Demográfico y Social, Económico, y Geográfico y del Medio Ambiente).',
        distractors: 'B) artículo 26 se refiere a la componente geográfica; C) artículo 27 al componente del medio ambiente; D) artículo 29 a los Comités Ejecutivos.'
    },
    // 17. Art. 57 - normas técnicas
    {
        type: 'a',
        text: 'El Instituto deberá elaborar y someter a consideración del Comité Ejecutivo correspondiente las normas técnicas y metodologías necesarias para realizar las Actividades Estadísticas y Geográficas cuando la Unidad que corresponda no las proponga oportunamente o estas no tomen en cuenta:',
        options: [
            'A) los estándares nacionales e internacionales o las mejores prácticas en la materia',
            'B) los principios de accesibilidad y transparencia',
            'C) las necesidades del Sistema',
            'D) los objetivos del Instituto'
        ],
        correct: 'A',
        justification: 'Artículo 57: "...cuando la Unidad que corresponda no las proponga oportunamente o estas no tomen en cuenta los estándares nacionales e internacionales o, en su caso, las mejores prácticas en la materia."',
        distractors: 'B) son principios rectores, no criterios para normas técnicas; C) es muy general; D) es vago.'
    },
    // 18. Art. 58 - regulación de captación, procesamiento y publicación
    {
        type: 'c',
        text: 'El Instituto regulará, mediante la expedición de disposiciones de carácter general, la captación, procesamiento y publicación de la Información, para el debido funcionamiento del Sistema o ______ las que utilicen las Unidades para tales efectos.',
        options: [
            'A) autorizará',
            'B) supervisará',
            'C) evaluará',
            'D) modificará'
        ],
        correct: 'A',
        justification: 'Artículo 58, primer párrafo: "...para el debido funcionamiento del Sistema o autorizará las que utilicen las Unidades para tales efectos."',
        distractors: 'B) supervisar es una función posterior; C) evaluar no se menciona en ese artículo; D) modificar no corresponde.'
    },
    // 19. Art. 59 - facultades exclusivas del INEGI
    {
        type: 'a',
        text: '¿Cuál de las siguientes NO es una facultad exclusiva del Instituto según el artículo 59?',
        options: [
            'A) Elaborar el catálogo nacional de indicadores',

        ],
        correct: 'A',
        justification: 'Artículo 77, fracción XVII: "Las demás que resulten de esta Ley y de otras disposiciones legales aplicables."',
        distractors: 'B) XVI es resolver otros asuntos; C) XV es nombrar secretario de actas; D) XIV es políticas de administración.'
    }
];

// --------------------------------------------------------------
// Lógica de la aplicación
// --------------------------------------------------------------
const total = questions.length;
let current = 0;
let selected = new Array(total).fill(null);
let verified = new Array(total).fill(false);
let correctCount = 0;

const qText = document.getElementById('qText');
const optionsContainer = document.getElementById('optionsContainer');
const feedbackBox = document.getElementById('feedbackBox');
const feedbackContent = document.getElementById('feedbackContent');
const qCounter = document.getElementById('qCounter');
const qStatus = document.getElementById('qStatus');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const checkBtn = document.getElementById('checkBtn');
const resetBtn = document.getElementById('resetBtn');
const progressBar = document.getElementById('progressBar');
const resultsArea = document.getElementById('resultsArea');
const resultsContent = document.getElementById('resultsContent');
const relacionList = document.getElementById('relacionList');

function renderQuestion(index) {
    const q = questions[index];
    qText.textContent = q.text;

    if (q.type === 'b' && q.relacionItems) {
        relacionList.style.display = 'block';
        relacionList.innerHTML = `<strong>Relacionar:</strong> ${q.relacionItems} <br> <strong>Opciones:</strong> ${q.relacionOpciones}`;
    } else {
        relacionList.style.display = 'none';
    }

    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.className = 'opt-label';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'question';
        radio.value = String.fromCharCode(65 + idx);
        radio.addEventListener('change', () => {
            selected[current] = radio.value;
            document.querySelectorAll('.opt-label').forEach(el => el.classList.remove('selected'));
            label.classList.add('selected');
            if (verified[current]) {
                verified[current] = false;
                feedbackBox.classList.remove('show');
                updateStatusAndProgress();
            }
        });
        if (selected[current] === radio.value) {
            radio.checked = true;
            label.classList.add('selected');
        }
        label.appendChild(radio);
        label.append(' ' + opt);
        optionsContainer.appendChild(label);
    });

    qCounter.textContent = `Pregunta ${index+1} / ${total}`;
    updateStatusAndProgress();

    if (verified[index]) {
        showFeedback(index);
    } else {
        feedbackBox.classList.remove('show');
    }

    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === total - 1);
    checkBtn.disabled = (selected[index] === null || verified[index]);
}

function updateStatusAndProgress() {
    const idx = current;
    if (verified[idx]) {
        qStatus.textContent = '✓ Verificada';
        qStatus.style.color = '#0d6e2b';
    } else if (selected[idx] !== null) {
        qStatus.textContent = '● Respondida';
        qStatus.style.color = '#b68b1a';
    } else {
        qStatus.textContent = '● Sin responder';
        qStatus.style.color = '#4a6a8a';
    }
    const answered = selected.filter(a => a !== null).length;
    const pct = (answered / total) * 100;
    progressBar.style.width = pct + '%';
    correctCount = 0;
    for (let i=0; i<total; i++) {
        if (verified[i] && selected[i] === questions[i].correct) correctCount++;
    }
}

function showFeedback(index) {
    const q = questions[index];
    const userAns = selected[index];
    const isCorrect = (userAns === q.correct);
    let html = '';
    if (isCorrect) {
        html += `<div class="badge-correct">✅ Correcto</div>`;
    } else {
        html += `<div class="badge-wrong">❌ Incorrecto</div>`;
    }
    html += `<div class="justify"><strong>Justificación:</strong> ${q.justification}</div>`;
    if (q.distractors) {
        html += `<div class="distractor"><strong>Análisis de distractores:</strong> ${q.distractors}</div>`;
    }
    feedbackContent.innerHTML = html;
    feedbackBox.classList.add('show');

    const labels = document.querySelectorAll('.opt-label');
    labels.forEach((label, idx) => {
        const letter = String.fromCharCode(65 + idx);
        label.classList.remove('correct-highlight', 'wrong-highlight');
        if (letter === q.correct) {
            label.classList.add('correct-highlight');
        } else if (letter === userAns && userAns !== q.correct) {
            label.classList.add('wrong-highlight');
        }
    });
    document.querySelectorAll('input[name="question"]').forEach(inp => inp.disabled = true);
    checkBtn.disabled = true;
    correctCount = 0;
    for (let i=0; i<total; i++) {
        if (verified[i] && selected[i] === questions[i].correct) correctCount++;
    }
    if (verified.every(v => v === true)) {
        showFinalResults();
    }
}

function verifyCurrent() {
    const idx = current;
    if (selected[idx] === null) {
        alert('Selecciona una opción primero.');
        return;
    }
    if (verified[idx]) {
        alert('Esta pregunta ya fue verificada.');
        return;
    }
    verified[idx] = true;
    showFeedback(idx);
    updateStatusAndProgress();
}

function showFinalResults() {
    const pct = (correctCount / total) * 100;
    resultsContent.innerHTML = `✅ Has completado el cuestionario.<br>
        <span style="font-size:2rem;">${correctCount} / ${total}</span><br>
        <span style="font-size:1.4rem;">${pct.toFixed(1)}% de aciertos</span>`;
    resultsArea.style.display = 'block';
}

function resetQuiz() {
    selected = new Array(total).fill(null);
    verified = new Array(total).fill(false);
    correctCount = 0;
    current = 0;
    resultsArea.style.display = 'none';
    feedbackBox.classList.remove('show');
    renderQuestion(0);
    document.querySelectorAll('input[name="question"]').forEach(inp => inp.disabled = false);
    checkBtn.disabled = false;
}

function goPrev() {
    if (current > 0) { current--; renderQuestion(current); }
}
function goNext() {
    if (current < total-1) { current++; renderQuestion(current); }
}

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
checkBtn.addEventListener('click', verifyCurrent);
resetBtn.addEventListener('click', resetQuiz);

renderQuestion(0);
</script>
</body>
</html>
