    // ================================================================
    //  LÓGICA DEL EXAMEN

    console.log('📋 Número de preguntas cargadas:', questions.length);

    // Validar estructura
    let hasError = false;
    questions.forEach((q, idx) => {
        if (!q.options || q.options.length !== 4) {
            console.error(`❌ Pregunta ${idx+1}: ${q.options?.length || 0} opciones, deben ser 4.`);
            hasError = true;
        }
        if (!q.distractors || q.distractors.length !== 3) {
            console.error(`❌ Pregunta ${idx+1}: ${q.distractors?.length || 0} distractores, deben ser 3.`);
            hasError = true;
        }
        if (q.correct === undefined || q.correct < 0 || q.correct > 3) {
            console.error(`❌ Pregunta ${idx+1}: correct = ${q.correct}, debe ser 0-3.`);
            hasError = true;
        }
    });

    if (hasError) {
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorText').textContent = 'Error en los datos. Revisa consola (F12).';
        document.getElementById('qText').textContent = '⚠️ No se puede cargar el examen.';
    }

    // ---- Variables ----
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    const totalQuestions = questions.length;

    const qNumber = document.getElementById('qNumber');
    const qText = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const fbTitle = document.getElementById('fbTitle');
    const fbDetail = document.getElementById('fbDetail');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const questionArea = document.getElementById('questionArea');
    const resultArea = document.getElementById('resultArea');
    const finalScore = document.getElementById('finalScore');
    const finalMsg = document.getElementById('finalMsg');
    const restartBtn = document.getElementById('restartBtn');

    // ---- Funciones ----
    function shuffleOptions(q) {
        const opts = q.options.map((text, index) => ({ text, index }));
        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return {
            options: opts.map(item => item.text),
            correct: opts.findIndex(item => item.index === q.correct)
        };
    }

    const shuffledQuestions = questions.map(q => ({
        ...q,
        options: shuffleOptions(q).options,
        correct: shuffleOptions(q).correct
    }));

    function renderQuestion(index) {
        try {
            const q = shuffledQuestions[index];
            qNumber.textContent = `Pregunta ${index+1} de ${totalQuestions}`;
            qText.textContent = q.text;
            optionsContainer.innerHTML = '';
            feedback.className = 'feedback';
            feedback.style.display = 'none';
            nextBtn.disabled = true;
            answered = false;

            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.dataset.index = i;
                const cleanText = opt.replace(/^[A-D]\)\s*/, '');
                div.innerHTML = `<span class="option-letter">${letters[i]}</span> ${cleanText}`;
                div.addEventListener('click', () => selectOption(i));
                optionsContainer.appendChild(div);
            });

            updateProgress();
        } catch (error) {
            console.error('❌ renderQuestion error:', error);
            document.getElementById('errorBox').style.display = 'block';
            document.getElementById('errorText').textContent = 'Error: ' + error.message;
        }
    }

    function selectOption(selected) {
        if (answered) return;
        const q = shuffledQuestions[currentIndex];
        const options = document.querySelectorAll('.option');
        options.forEach((el, i) => {
            el.classList.add('disabled');
            if (i === q.correct) el.classList.add('correct');
            if (i === selected && i !== q.correct) el.classList.add('wrong');
            if (i === selected) el.classList.add('selected');
        });

        const isCorrect = (selected === q.correct);
        if (isCorrect) score++;

        feedback.style.display = 'block';
        if (isCorrect) {
            feedback.className = 'feedback correct';
            fbTitle.textContent = '✅ Correcto';
        } else {
            feedback.className = 'feedback wrong';
            fbTitle.textContent = '❌ Incorrecto';
        }
        let detail = `<strong>Justificación:</strong> ${q.justification}<br><br>`;
        detail += `<strong>Análisis de distractores:</strong><br>`;
        q.distractors.forEach((d, i) => {
            const letter = String.fromCharCode(65 + i);
            detail += `• ${letter}: ${d}<br>`;
        });
        fbDetail.innerHTML = detail;

        answered = true;
        nextBtn.disabled = false;
        updateProgress();
    }

    function nextQuestion() {
        if (currentIndex < totalQuestions - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const pct = ((currentIndex + (answered ? 1 : 0)) / totalQuestions) * 100;
        progressFill.style.width = `${Math.min(pct, 100)}%`;
    }

    function showResults() {
        questionArea.classList.add('hidden');
        resultArea.classList.remove('hidden');
        const pct = Math.round((score / totalQuestions) * 100);
        finalScore.textContent = `${pct}%`;
        let msg = '';
        if (pct === 100) msg = '🏆 ¡Excelente! Dominas perfectamente los conceptos.';
        else if (pct >= 80) msg = '🌟 Muy bien. Sólido entendimiento.';
        else if (pct >= 60) msg = '📘 Buen esfuerzo. Revisa los temas donde fallaste.';
        else msg = '📖 Repasa los capítulos 4, 5 y 8 y vuelve a intentarlo.';
        finalMsg.textContent = msg;
    }

    function restart() {
        currentIndex = 0;
        score = 0;
        answered = false;
        questionArea.classList.remove('hidden');
        resultArea.classList.add('hidden');
        document.getElementById('errorBox').style.display = 'none';
        renderQuestion(0);
    }

    // ---- Eventos ----
    nextBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restart);

    // ---- Inicio ----
    if (!hasError) {
        renderQuestion(0);
    }
</script>
