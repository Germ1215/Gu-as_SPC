<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haupt. Guía rápida de población (Capítulo 4, 5 y 8)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f0f4f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px 35px 40px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1a2b3c;
            margin-top: 0;
            margin-bottom: 6px;
            border-left: 6px solid #2a7faa;
            padding-left: 18px;
        }
        .subtitle {
            color: #4a5f73;
            margin-top: -2px;
            margin-bottom: 25px;
            font-size: 1rem;
            padding-left: 24px;
            opacity: 0.8;
        }
        .progress-bar {
            background: #e6edf5;
            border-radius: 40px;
            height: 10px;
            margin-bottom: 28px;
            overflow: hidden;
        }
        .progress-fill {
            background: #2a7faa;
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 0.4s ease;
        }
        .question-counter {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            color: #2a4b66;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .question-text {
            font-size: 1.35rem;
            font-weight: 500;
            color: #0b1e2e;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .option-btn {
            background: #f7faff;
            border: 2px solid #dce5ef;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            color: #0b1e2e;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-btn:hover:not(:disabled) {
            background: #eaf1fb;
            border-color: #8bb3d1;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        .option-btn .letter {
            display: inline-block;
            font-weight: 700;
            color: #1f4b6e;
            width: 28px;
            flex-shrink: 0;
        }
        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .option-btn.correct .letter {
            color: #155724;
        }
        .option-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .option-btn.incorrect .letter {
            color: #721c24;
        }
        .option-btn.show-correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .feedback {
            background: #f1f6fb;
            border-radius: 20px;
            padding: 20px 24px;
            margin: 18px 0 25px;
            border-left: 5px solid #2a7faa;
            display: none;
        }
        .feedback.visible {
            display: block;
        }
        .feedback .result {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .feedback .result.correct-text {
            color: #1d7a34;
        }
        .feedback .result.incorrect-text {
            color: #b22234;
        }
        .feedback .explanation {
            color: #1e3a5a;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.98rem;
        }
        .feedback .explanation strong {
            color: #0b2b44;
        }
        .btn-next {
            background: #2a7faa;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(42, 127, 170, 0.25);
            margin-top: 6px;
        }
        .btn-next:hover:not(:disabled) {
            background: #1e6488;
            transform: scale(1.02);
        }
        .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .results-container {
            text-align: center;
            padding: 20px 0;
        }
        .results-container .score {
            font-size: 3.2rem;
            font-weight: 700;
            color: #1a2b3c;
        }
        .results-container .detail {
            font-size: 1.2rem;
            color: #2a4b66;
            margin-top: 6px;
        }
        .results-container .message {
            margin-top: 20px;
            font-size: 1.1rem;
            background: #e9f0f8;
            padding: 16px;
            border-radius: 30px;
        }
        .btn-restart {
            background: #4a6f8a;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 25px;
        }
        .btn-restart:hover {
            background: #2f5670;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }
            h1 {
                font-size: 1.5rem;
                padding-left: 12px;
            }
            .question-text {
                font-size: 1.15rem;
            }
            .option-btn {
                font-size: 0.95rem;
                padding: 12px 16px;
            }
            .feedback {
                padding: 16px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>📊 Guía rápida de población</h1>
        <div class="subtitle">Capítulos 4 · 5 · 8 — Autoevaluación</div>

        <!-- Barra de progreso -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Contador -->
        <div class="question-counter">
            <span id="qNum">Pregunta 1 de 50</span>
            <span id="qStatus">⏳ Sin responder</span>
        </div>

        <!-- Enunciado -->
        <div class="question-text" id="questionText"></div>

        <!-- Opciones -->
        <div class="options" id="optionsContainer"></div>

        <!-- Feedback -->
        <div class="feedback" id="feedback">
            <div class="result" id="resultLabel"></div>
            <div class="explanation" id="explanationText"></div>
        </div>

        <!-- Botón siguiente -->
        <button class="btn-next" id="btnNext" disabled>Siguiente →</button>

        <!-- Pantalla de resultados (inicialmente oculta) -->
        <div class="results-container hidden" id="resultsContainer">
            <div class="score" id="finalScore">0%</div>
            <div class="detail" id="finalDetail">0 aciertos de 50</div>
            <div class="message" id="finalMessage"></div>
            <button class="btn-restart" id="btnRestart">↻ Reintentar examen</button>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        //  BASE DE DATOS DE PREGUNTAS (50 preguntas)
        //  Basadas EXCLUSIVAMENTE en los capítulos 4, 5 y 8 del documento.
        //  Tipos: a) distractores de confusión, b) relación, c) completar.
        //  La respuesta correcta (A,B,C,D) se distribuye aleatoriamente.
        // -------------------------------------------------------------
        const questions = [{
            // 1 (tipo c)
            pregunta: 'La fecundidad se refiere al número de niños nacidos vivos a las mujeres, mientras que la ________ se refiere a la capacidad física de reproducción.',
            opciones: {
                A: 'fertilidad',
                B: 'natalidad',
                C: 'mortalidad',
                D: 'nupcialidad'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. El documento establece: "La fecundidad se relaciona con el número de niños nacidos vivos a las mujeres. No es lo mismo que la fertilidad, que implica la capacidad física de reproducción de una mujer." (pág. 13)\n\n❌ B: natalidad es la frecuencia de nacimientos en la población. C: mortalidad son las muertes. D: nupcialidad es el matrimonio como fenómeno poblacional.'
        }, {
            // 2 (tipo a)
            pregunta: '¿Cuál de las siguientes afirmaciones sobre la tasa global de fecundidad (TGF) es correcta según el texto?',
            opciones: {
                A: 'Es el número promedio de hijos que una mujer tendrá al final de sus años reproductivos si mantiene las tasas de fecundidad actuales a lo largo de su vida.',
                B: 'Es el número total de hijos nacidos de una mujer durante toda su vida, medido al final de sus años reproductivos.',
                C: 'Es el número de nacimientos por cada 1.000 mujeres en edad reproductiva en un año determinado.',
                D: 'Es una medida que solo cuenta las hijas nacidas, no los hijos varones.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. La TGF es "el número promedio de hijos que una mujer habría tenido al final de sus años reproductivos si la misma se hubiera ajustado a las tasas de fecundidad por edad específica durante cada año de su vida reproductiva" (pág. 15). Es una medida sintética, no el total real.\n\n❌ B: describe la tasa final de fecundidad, no la TGF. C: es la tasa general de fecundidad. D: es la tasa bruta de reproducción.'
        }, {
            // 3 (tipo b)
            pregunta: 'Relacione cada medida con su definición correcta:\n1. Tasa bruta de reproducción (TBR)\n2. Tasa neta de reproducción (TNR)\n3. Razón de niños a mujeres',
            opciones: {
                A: '1-Número promedio de hijas que tendría una mujer si se ajusta a tasas de fecundidad; 2-Número promedio de hijas considerando la mortalidad; 3-Niños menores de 5 por 1.000 mujeres en edad reproductiva.',
                B: '1-Número promedio de hijos totales que tendría una mujer; 2-Número promedio de hijas considerando mortalidad; 3-Niños menores de 1 año por 1.000 mujeres.',
                C: '1-Número promedio de hijas que tendría una mujer; 2-Número promedio de hijos totales considerando mortalidad; 3-Niños menores de 5 por 1.000 mujeres solteras.',
                D: '1-Número promedio de hijas que tendría una mujer sin considerar mortalidad; 2-Número promedio de hijas considerando solo mortalidad infantil; 3-Niños menores de 5 por 100 mujeres.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. Según el texto: TBR = "número promedio de hijas que una mujer (o grupo de mujeres) tendría durante su vida si se ajustara a las tasas de fecundidad por edad específica" (pág. 17). TNR = "número promedio de hijas que nacerían de una mujer... si durante toda su vida, desde nacer, se ajustara a las tasas de fecundidad y mortalidad específicas" (pág. 17). Razón niños-mujeres = "número de niños menores de 5 años por 1.000 mujeres en edad reproductiva" (pág. 19).\n\n❌ B: confunde hijos totales con hijas. C: usa mujeres solteras incorrectamente. D: usa 100 en lugar de 1.000 y limita mortalidad a infantil.'
        }, {
            // 4 (tipo a)
            pregunta: 'La fecundidad a nivel de reemplazo se alcanza cuando:',
            opciones: {
                A: 'la tasa neta de reproducción es igual a 1,00 y la población deja de crecer inmediatamente.',
                B: 'la tasa global de fecundidad es exactamente 2,0 en todos los países.',
                C: 'la tasa neta de reproducción es igual a 1,00, pero el crecimiento puede continuar debido al ímpetu demográfico.',
                D: 'la tasa bruta de reproducción es igual a 1,00 y las mujeres tienen suficientes hijas para reemplazarse.'
            },
            correcta: 'C',
            explicacion: '✅ Correcto. El texto dice: "Una tasa neta de reproducción de 1,00 es igual al nivel de reemplazo" y "Una vez se alcanza la fecundidad a nivel de reemplazo, los nacimientos alcanzarán gradualmente un equilibrio con las muertes... el tiempo que toma en realizarse este proceso varía ampliamente dependiendo de la estructura por edad" (pág. 19). Además, el ímpetu demográfico explica que la población puede seguir creciendo.\n\n❌ A: no es inmediato. B: la TGF de reemplazo varía; en países desarrollados es ~2,1, en desarrollo mayor. D: la TBR no considera mortalidad, por lo que no es suficiente.'
        }, {
            // 5 (tipo c)
            pregunta: 'El ________ demográfico se refiere a la tendencia de una población a continuar creciendo después de alcanzar la fecundidad a nivel de reemplazo, debido a una concentración de personas jóvenes.',
            opciones: {
                A: 'crecimiento natural',
                B: 'impulso',
                C: 'ímpetu',
                D: 'potencial'
            },
            correcta: 'C',
            explicacion: '✅ Correcto. "El ímpetu demográfico se refiere a la tendencia de una población de continuar su crecimiento después de alcanzar su fecundidad a nivel de reemplazo" (pág. 19).\n\n❌ A: crecimiento natural es el superávit de nacimientos sobre muertes. B: "impulso" no es el término usado. D: "potencial" no aparece en esa definición.'
        }, {
            // 6 (tipo a)
            pregunta: '¿Cuál de los siguientes NO es uno de los cuatro factores directos que afectan la fecundidad según el documento?',
            opciones: {
                A: 'Proporción de mujeres en relaciones de pareja',
                B: 'Porcentaje de mujeres que usan anticonceptivos',
                C: 'Nivel de ingresos per cápita',
                D: 'Nivel de abortos provocados'
            },
            correcta: 'C',
            explicacion: '✅ Correcto. El texto enumera los cuatro factores: "(1) la proporción de mujeres en relaciones de pareja; (2) el porcentaje de mujeres que usan métodos anticonceptivos; (3) la proporción de mujeres que actualmente no son fértiles (principalmente debido a que están amamantando); (4) el nivel de abortos provocados" (pág. 21). El nivel de ingresos no se menciona como factor directo.\n\n❌ A, B y D son los factores enumerados.'
        }, {
            // 7 (tipo b)
            pregunta: 'Asocie cada tasa con su fórmula conceptual correcta:\n1. Tasa de natalidad (bruta)\n2. Tasa general de fecundidad\n3. Tasa de mortalidad infantil',
            opciones: {
                A: '1-Nacimientos / población total × 1.000; 2-Nacimientos / mujeres 15-49 × 1.000; 3-Muertes <1 año / nacidos vivos × 1.000.',
                B: '1-Nacimientos / mujeres 15-49 × 1.000; 2-Nacimientos / población total × 1.000; 3-Muertes <1 año / población total × 1.000.',
                C: '1-Nacimientos / población total × 100; 2-Nacimientos / mujeres 15-49 × 100; 3-Muertes <1 año / nacidos vivos × 100.',
                D: '1-Nacimientos / hombres y mujeres × 1.000; 2-Nacimientos / mujeres 15-44 × 1.000; 3-Muertes <28 días / nacidos vivos × 1.000.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. Tasa de natalidad = "número de nacimientos vivos por cada 1.000 habitantes" (pág. 13). Tasa general de fecundidad = "número de nacimientos vivos por cada grupo de 1.000 mujeres entre las edades de 15 a 49 años" (pág. 13). Tasa de mortalidad infantil = "número de niños menores de 1 año que fallece por cada 1.000 nacidos vivos" (pág. 27).\n\n❌ B: invierte las dos primeras. C: usa constante 100 en lugar de 1.000. D: usa 15-44 en lugar de 15-49 y <28 días para neonatal, no infantil.'
        }, {
            // 8 (tipo c)
            pregunta: 'La tasa de prevalencia del uso de anticonceptivos se define como el número de mujeres en edad reproductiva que utilizan métodos anticonceptivos por cada ________ mujeres en edad reproductiva.',
            opciones: {
                A: '100',
                B: '1.000',
                C: '10.000',
                D: '100.000'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. "La tasa de prevalencia del uso de anticonceptivos es el número de mujeres en edad reproductiva que están utilizando métodos anticonceptivos por cada 100 mujeres en edad reproductiva" (pág. 22).\n\n❌ B: 1.000 es para muchas tasas, pero no para esta. C y D no corresponden.'
        }, {
            // 9 (tipo a)
            pregunta: 'La razón de abortos provocados y la tasa de abortos provocados se diferencian en que:',
            opciones: {
                A: 'la razón se expresa por 1.000 nacidos vivos, mientras que la tasa se expresa por 1.000 mujeres en edad reproductiva.',
                B: 'la tasa se expresa por 1.000 nacidos vivos, mientras que la razón se expresa por 1.000 mujeres.',
                C: 'ambas se expresan por 1.000 nacidos vivos, pero la tasa incluye abortos espontáneos.',
                D: 'la razón es siempre más alta que la tasa porque incluye todos los abortos.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. "Tasa de abortos provocados es el número de abortos provocados por cada 1.000 mujeres en edad reproductiva" (pág. 22). "Razón de abortos provocados es el número de abortos provocados por cada 1.000 nacidos vivos" (pág. 23).\n\n❌ B: invierte las definiciones. C: ninguna incluye espontáneos; son provocados. D: no necesariamente siempre más alta; depende del contexto.'
        }, {
            // 10 (tipo c)
            pregunta: 'La tasa de abortos provocados en Hungría en 1996 fue de 34,8, lo que significa que hubo ________ por cada 1.000 mujeres de 15 a 49 años.',
            opciones: {
                A: '34,8 abortos provocados',
                B: '34,8 nacidos vivos',
                C: '34,8 embarazos',
                D: '34,8 muertes maternas'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. La definición dice: "Tasa de abortos provocados es el número de abortos provocados por cada 1.000 mujeres en edad reproductiva" (pág. 22). El ejemplo de Hungría indica 34,8 abortos por 1.000 mujeres.\n\n❌ B: es abortos, no nacidos vivos. C: embarazos no es el término. D: muertes maternas es otro concepto.'
        }, {
            // 11 (tipo a)
            pregunta: '¿Cuál de las siguientes afirmaciones sobre la tasa de mortalidad (bruta) es correcta según el texto?',
            opciones: {
                A: 'Es una medida precisa para comparar el nivel de salud entre países porque no se ve afectada por la estructura por edad.',
                B: 'Se calcula como el número de muertes por cada 1.000 habitantes y siempre refleja condiciones de salud.',
                C: 'Puede ser engañosa al comparar países porque la estructura por edad influye en el número de muertes.',
                D: 'Es más alta en países jóvenes porque hay más niños que mueren.'
            },
            correcta: 'C',
            explicacion: '✅ Correcto. El texto advierte: "Las tasas brutas de mortalidad se ven afectadas por muchas características de la población, especialmente la estructura por edad. Por lo tanto, al comparar las tasas de mortalidad de distintos países, es prudente ajustar las diferencias en composición por edad" (pág. 25). Ejemplo Suecia vs Panamá.\n\n❌ A: no es precisa; se ve afectada. B: no siempre refleja salud por el sesgo de edad. D: no necesariamente; los jóvenes tienen menor mortalidad, pero la tasa bruta puede ser baja en países jóvenes.'
        }, {
            // 12 (tipo b)
            pregunta: 'Relacione los conceptos de mortalidad con su definición:\n1. Tasa de mortalidad por edad específica\n2. Tasa de mortalidad por causas específicas\n3. Tasa de mortalidad materna',
            opciones: {
                A: '1-Muertes de un grupo de edad / población de ese grupo × 1.000; 2-Muertes por causa específica / población total × 100.000; 3-Muertes maternas / nacidos vivos × 100.000.',
                B: '1-Muertes totales / población total × 1.000; 2-Muertes por causa / población total × 1.000; 3-Muertes maternas / mujeres en edad fértil × 100.000.',
                C: '1-Muertes de un grupo de edad / población total × 1.000; 2-Muertes por causa / población total × 100.000; 3-Muertes maternas / nacidos vivos × 1.000.',
                D: '1-Muertes de un grupo de edad / población de ese grupo × 100.000; 2-Muertes por causa / población total × 100.000; 3-Muertes maternas / mujeres embarazadas × 100.000.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. Tasa por edad específica: "Muertes de personas de 40 a 44 años de edad / Población total de 40 a 44 años de edad × 1.000" (pág. 26). Tasa por causas específicas: "expresadas normalmente por el número de muertes por cada 100.000 habitantes" (pág. 26). Razón de mortalidad materna: "número de mujeres que fallecen... por cada 100.000 nacidos vivos" (pág. 28).\n\n❌ B: la tasa por edad específica no usa población total; la materna no usa mujeres en edad fértil como denominador. C: la materna usa 100.000, no 1.000. D: la tasa por edad específica usa 1.000 no 100.000 y el denominador de materna no es mujeres embarazadas.'
        }, {
            // 13 (tipo a)
            pregunta: 'La esperanza de vida al nacer en un país con alta mortalidad infantil, como Malaui (46 años en 1996), refleja que:',
            opciones: {
                A: 'los adultos en Malaui viven en promedio solo 46 años.',
                B: 'si las tasas de mortalidad actuales se mantienen, un recién nacido viviría en promedio 46 años, pero los que sobreviven el primer año pueden esperar vivir más años.',
                C: 'la esperanza de vida es una medida real del número de años que vive cada persona.',
                D: 'la esperanza de vida es igual a la edad mediana de la población.'
            },
            correcta: 'B',
            explicacion: '✅ Correcto. El texto explica que la esperanza de vida es una estimación hipotética basada en tasas actuales. Además: "las bajas esperanzas de vida de los países en desarrollo se deben en gran medida a las altas tasas de mortalidad infantil. Por ejemplo, en 1994, la esperanza de vida al nacer para las mujeres de Bangladesh era de 58 años, pero si una mujer de Bangladesh sobrevivía hasta cumplir 1 año, la misma podía esperar vivir hasta los 62" (pág. 29).\n\n❌ A: no es que los adultos vivan solo 46; es el promedio al nacer. C: no es real, es hipotética. D: no es lo mismo que la edad mediana.'
        }, {
            // 14 (tipo c)
            pregunta: 'En una tabla de mortalidad, la columna que muestra el número total de "años-persona" que se vivirían durante un período de edad y todos los períodos siguientes se utiliza para calcular la ________.',
            opciones: {
                A: 'tasa de mortalidad',
                B: 'esperanza de vida',
                C: 'probabilidad de muerte',
                D: 'morbilidad'
            },
            correcta: 'B',

        }, {
            // 38 (tipo a)

            correcta: 'A',
            explicacion: '✅ Correcto. "la esperanza de vida aumenta con la edad; es decir, se obtiene una 'bonificación' por haber sobrevivido. Los 59.464 hombres malayos que llegaron a los 70 años de edad, por ejemplo, pueden esperar vivir más de 10 años adicionales, mucho más que sus 69 años de esperanza de vida al nacer" (pág. 30).\n\n❌ B: no es que tengan mayor esperanza de vida total, sino que los años adicionales esperados desde esa edad son mayores que lo que se predijo al nacer. C: no siempre, la esperanza de vida a edades avanzadas puede ser mayor que la al nacer. D: sí cambia con la edad.'
        }, {
            // 39 (tipo b)

                D: '1-Inmigrantes / población en origen × 1.000; 2-Emigrantes / población en destino × 1.000; 3-Inmigrantes - Emigrantes.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. Tasa de inmigración: "número de inmigrantes que llegan a un destino por cada 1.000 habitantes en ese destino" (pág. 35). Tasa de emigración: "número de emigrantes que abandonan las áreas de donde provienen por cada 1.000 habitantes de esa área de donde provienen" (pág. 35). Migración neta: "efecto neto que tienen la inmigración y la emigración... (aumento o disminución)" (pág. 36), es decir Inmigrantes - Emigrantes.\n\n❌ B: invierte términos y signos. C: usa población total y suma. D: usa denominadores incorrectos.'
        }, {

        }, {
            // 44 (tipo c)
            pregunta: 'La ________ es una estimación del número promedio de años de vida adicionales que una persona podría esperar vivir si las tasas de mortalidad por edad específica para un año determinado permanecieran durante el resto de su vida.',
            opciones: {

                C: 'edad mediana',
                D: 'probabilidad de supervivencia'
            },

            explicacion: '✅ Correcto. "La esperanza de vida es una estimación del número promedio de años de vida adicionales que una persona podría esperar vivir si las tasas de mortalidad por edad específica para un año determinado permanecieran durante el resto de su vida" (pág. 28).\n\n❌ B: longevidad es la edad máxima posible. C: edad mediana es otra cosa. D: probabilidad de supervivencia es la proporción que sobrevive a un intervalo.'
        }, {
            // 45 (tipo a)
            pregunta: 'Según el documento, ¿cuál de los siguientes NO es un componente del cambio de población?',
            opciones: {
                A: 'Nacimientos',
                B: 'Muertes',
                C: 'Migración',

            },
            correcta: 'D',
            explicacion: '✅ Correcto. "El cambio en una población tiene tres componentes: nacimientos, muertes y migración" (pág. 43). Los matrimonios no son un componente del cambio poblacional, aunque afectan la fecundidad.\n\n❌ A, B, C son los componentes explícitos.'
        }, {
            // 46 (tipo b)
            pregunta: 'Asocie cada tasa con su constante estándar (según el texto):\n1. Tasa de mortalidad por causas específicas\n2. Tasa de abortos provocados\n3. Razón de mortalidad materna',
            opciones: {
                A: '1-100.000; 2-1.000; 3-100.000',

                C: '1-100.000; 2-100.000; 3-1.000',
                D: '1-100.000; 2-1.000; 3-1.000'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. Tasa de mortalidad por causas específicas: "expresadas normalmente por el número de muertes por cada 100.000 habitantes" (pág. 26). Tasa de abortos provocados: "número de abortos provocados por cada 1.000 mujeres en edad reproductiva" (pág. 22). Razón de mortalidad materna: "por cada 100.000 nacidos vivos" (pág. 28).\n\n❌ B: mortalidad por causas no usa 1.000. C: abortos no usa 100.000. D: materna no usa 1.000.'

            pregunta: 'La tasa de fecundidad conyugal se define como el número de nacidos vivos legítimos por 1.000 mujeres casadas de 15 a 49 años. ¿Qué implica una alta tasa de fecundidad conyugal en comparación con la tasa general de fecundidad?',

                C: 'Que la tasa de natalidad es alta porque hay muchas mujeres casadas.',
                D: 'Que la fecundidad general es necesariamente alta.'
            },
            correcta: 'B',
            explicacion: '✅ Correcto. La tasa de fecundidad conyugal mide la fecundidad entre mujeres casadas. Si es alta, indica que las casadas tienen muchos hijos, pero la tasa general de fecundidad puede ser baja si hay pocas casadas. El documento no da una definición explícita de esta tasa, pero aparece en el glosario (pág. 65). La opción B es la interpretación más ajustada.\n\n❌ A: no necesariamente; puede haber nacimientos fuera del matrimonio. C: no es una consecuencia directa. D: no siempre, depende de la proporción de casadas.'
        }, {
            // 48 (tipo c)
            pregunta: 'En la transición demográfica, el descenso de la mortalidad normalmente ________ al descenso de la fecundidad, lo que resulta en un crecimiento rápido durante el período de transición.',
            opciones: {
                A: 'precede',
                B: 'sigue',
                C: 'ocurre simultáneamente con',
                D: 'es independiente de'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. "La disminución de la mortalidad normalmente precede a la reducción de la fecundidad, lo que resulta en un crecimiento de la población durante el período de transición" (pág. 46).\n\n❌ B: al revés. C: no es simultáneo. D: no es independiente.'
        }, {
            // 49 (tipo a)
            pregunta: 'La población nacida en el extranjero se define como las personas nacidas en el exterior de las fronteras de un país. ¿Qué información proporciona esta medida?',
            opciones: {
                A: 'El número de inmigrantes que residen actualmente en el país, independientemente de su estatus migratorio.',
                B: 'El número de personas que han inmigrado durante el último año.',
                C: 'La proporción de la población que tiene ciudadanía extranjera.',
                D: 'El número de emigrantes que han salido del país.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. "La población nacida en el extranjero representa las personas nacidas en el exterior de las fronteras o territorios de un país" (pág. 38). Es un stock, no un flujo, e incluye a todos los nacidos fuera, independientemente de cuándo llegaron.\n\n❌ B: es un flujo, no un stock. C: no es ciudadanía, es lugar de nacimiento. D: son emigrantes, no residentes.'
        }, {
            // 50 (tipo b)
            pregunta: 'Relacione los conceptos de urbanización:\n1. Porcentaje urbano\n2. Crecimiento urbano\n3. Área metropolitana',
            opciones: {
                A: '1-Población urbana / total × 100; 2-Aumento del tamaño físico de una zona urbana; 3-Concentración de 100.000 o más con núcleo y áreas integradas.',
                B: '1-Población urbana / total × 100; 2-Aumento de la población urbana; 3-Ciudad con más de 50.000 habitantes.',
                C: '1-Población en ciudades / población rural × 100; 2-Crecimiento de la población total; 3-Área con alta densidad.',
                D: '1-Población urbana / total × 100; 2-Aumento de la proporción urbana; 3-Área con más de 1 millón de habitantes.'
            },
            correcta: 'A',
            explicacion: '✅ Correcto. Porcentaje urbano: "población que reside en zonas urbanas puede expresarse como un porcentaje de la población total" (pág. 41). Crecimiento urbano: "aumento del tamaño físico de una zona urbana" (pág. 41). Área metropolitana: "concentración grande de población, normalmente un área de 100.000 o más residentes con una ciudad importante como su núcleo, además de áreas suburbanas y 'extraurbanas' que rodean la ciudad y que están integradas social y económicamente a la misma" (pág. 42).\n\n❌ B: crecimiento urbano no es aumento de población, sino físico. C: porcentaje no es relación con rural. D: metropolitana no es solo 1 millón.'
        }];

        // -------------------------------------------------------------
        //  LÓGICA DE LA APLICACIÓN
        // -------------------------------------------------------------
        const app = {
            current: 0,
            answers: [], // almacena 'correcta' o 'incorrecta' para cada pregunta
            answered: false,
            total: questions.length,

            init() {
                this.renderQuestion();
                document.getElementById('btnNext').addEventListener('click', () => this.nextQuestion());
                document.getElementById('btnRestart').addEventListener('click', () => this.restart());
            },

            renderQuestion() {
                const q = questions[this.current];
                const container = document.getElementById('optionsContainer');
                const feedback = document.getElementById('feedback');
                const btnNext = document.getElementById('btnNext');
                const progress = document.getElementById('progressFill');
                const qNum = document.getElementById('qNum');
                const qStatus = document.getElementById('qStatus');

                // Mostrar enunciado
                document.getElementById('questionText').innerHTML = q.pregunta;

                // Opciones
                container.innerHTML = '';
                const letters = ['A', 'B', 'C', 'D'];
                for (let letra of letters) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.setAttribute('data-letter', letra);
                    btn.innerHTML = `<span class="letter">${letra}.</span> ${q.opciones[letra]}`;
                    btn.addEventListener('click', () => this.selectOption(letra));
                    container.appendChild(btn);
                }

                // Resetear feedback
                feedback.className = 'feedback';
                feedback.style.display = 'none';
                document.getElementById('resultLabel').textContent = '';
                document.getElementById('explanationText').textContent = '';

                // Botón siguiente deshabilitado
                btnNext.disabled = true;

                // Actualizar contador y progreso
                qNum.textContent = `Pregunta ${this.current + 1} de ${this.total}`;
                qStatus.textContent = '⏳ Sin responder';
                progress.style.width = `${(this.current / this.total) * 100}%`;

                // Habilitar opciones
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);

                this.answered = false;
            },

            selectOption(letter) {
                if (this.answered) return;
                const q = questions[this.current];
                const isCorrect = (letter === q.correcta);
                const buttons = document.querySelectorAll('.option-btn');

                // Deshabilitar todos los botones
                buttons.forEach(b => b.disabled = true);

                // Marcar correcta/incorrecta en cada opción
                buttons.forEach(b => {
                    const l = b.getAttribute('data-letter');
                    if (l === q.correcta) {
                        b.classList.add('show-correct');
                    }
                    if (l === letter && !isCorrect) {
                        b.classList.add('incorrect');
                    }
                    if (l === letter && isCorrect) {
                        b.classList.add('correct');
                    }
                });

                // Guardar resultado
                this.answers[this.current] = isCorrect ? 'correcta' : 'incorrecta';

                // Mostrar feedback
                const feedback = document.getElementById('feedback');
                feedback.style.display = 'block';
                feedback.className = 'feedback visible';
                const resultLabel = document.getElementById('resultLabel');
                const explanation = document.getElementById('explanationText');

                if (isCorrect) {
                    resultLabel.className = 'result correct-text';
                    resultLabel.textContent = '✅ ¡Correcto!';
                } else {
                    resultLabel.className = 'result incorrect-text';
                    resultLabel.textContent = `❌ Incorrecto. La respuesta correcta era ${q.correcta}.`;
                }
                explanation.textContent = q.explicacion;

                // Actualizar estado
                document.getElementById('qStatus').textContent = isCorrect ? '✅ Correcta' : '❌ Incorrecta';

                // Habilitar botón siguiente
                document.getElementById('btnNext').disabled = false;
                this.answered = true;
            },

            nextQuestion() {
                if (this.current < this.total - 1) {
                    this.current++;
                    this.renderQuestion();
                } else {
                    this.showResults();
                }
            },

            showResults() {
                // Ocultar elementos del cuestionario
                document.getElementById('questionText').style.display = 'none';
                document.getElementById('optionsContainer').style.display = 'none';
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('btnNext').style.display = 'none';
                document.querySelector('.question-counter').style.display = 'none';
                document.getElementById('progressFill').style.width = '100%';

                // Calcular puntuación
                const correctas = this.answers.filter(a => a === 'correcta').length;
                const porcentaje = Math.round((correctas / this.total) * 100);

                document.getElementById('finalScore').textContent = `${porcentaje}%`;
                document.getElementById('finalDetail').textContent = `${correctas} aciertos de ${this.total}`;

                let mensaje = '';
                if (porcentaje >= 90) mensaje = '🌟 ¡Excelente! Dominas los conceptos demográficos.';
                else if (porcentaje >= 70) mensaje = '📘 Buen trabajo, pero revisa los capítulos para afianzar.';
                else if (porcentaje >= 50) mensaje = '📖 Te recomendamos repasar las definiciones y fórmulas.';
                else mensaje = '🔁 Vuelve a estudiar los capítulos 4, 5 y 8, luego intenta de nuevo.';
                document.getElementById('finalMessage').textContent = mensaje;

                document.getElementById('resultsContainer').classList.remove('hidden');
            },

            restart() {
                // Reiniciar todo
                this.current = 0;
                this.answers = [];
                this.answered = false;

                // Mostrar elementos ocultos
                document.getElementById('questionText').style.display = 'block';
                document.getElementById('optionsContainer').style.display = 'flex';
                document.getElementById('btnNext').style.display = 'inline-block';
                document.querySelector('.question-counter').style.display = 'flex';
                document.getElementById('resultsContainer').classList.add('hidden');

                this.renderQuestion();
                document.getElementById('progressFill').style.width = '0%';
            }
        };

        // Iniciar la aplicación
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
