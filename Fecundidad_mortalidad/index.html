<script>
    // ========== PREGUNTAS (50) ==========
    // Basadas en párrafos 276-287 (Calidad datos registro civil), 407-421 (Errores distribución edades), 551-559 (Historiales nacimientos)
    const questions = [
        // ---- Calidad de los datos del registro civil (párrafos 276-287) ----
        {
            type: 'opcion',
            text: 'Según el párrafo 276, la calidad de la cobertura de los datos del registro civil a nivel nacional, cuando se tabulan los sucesos por fecha de acaecimiento, depende fundamentalmente de:',
            options: [
                'A) La exactitud de la codificación de la causa de muerte.',
                'B) Que el registro sea completo, con poca o ninguna inclusión indebida.',
                'C) La eliminación de los registros tardíos del sistema.',
                'D) La comparación con los datos del censo más reciente.'
            ],
            correct: 1,
            justification: 'El párrafo 276 establece: "A nivel nacional, cuando se tabulan los sucesos por fecha de acaecimiento, la calidad de la cobertura de los datos del registro civil depende fundamentalmente de que ésta sea completa; en general, habrá poca o ninguna inclusión."',
            distractors: [
                'A) La causa de muerte es un aspecto de contenido, no de cobertura.',
                'C) Los registros tardíos no se eliminan; se analizan y pueden ajustarse.',
                'D) La comparación con censos es un método de evaluación, no el fundamento de la calidad.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 276 señala que la cobertura de los nacimientos y la de las defunciones en el registro civil:',
            options: [
                'A) Son siempre idénticas, ya que el mismo sistema las registra.',
                'B) Pueden ser muy diferentes, y el registro de defunciones de menores de un año puede ser mucho más incompleto que el de otras defunciones.',
                'C) Son independientes de la calidad del contenido.',
                'D) Dependen exclusivamente de la legislación del país.'
            ],
            correct: 1,
            justification: 'El párrafo 276: "Cabe recalcar que la cobertura de los nacimientos quizás sea muy diferente de las de las defunciones y que cuando es incompleta es posible que el registro de defunciones de menores de un año lo sea en medida mucho mayor que el de otras defunciones."',
            distractors: [
                'A) No son idénticas; pueden diferir.',
                'C) La cobertura y el contenido están relacionados, aunque son dimensiones distintas.',
                'D) La legislación influye pero no es el único factor.'
            ]
        },
        {
            type: 'opcion',
            text: 'Cuando los sucesos se tabulan por fecha de registro en lugar de por fecha de acaecimiento, según el párrafo 277, los sucesos que ocurrieron antes del período pero se registraron durante él se consideran:',
            options: [
                'A) Omisiones del período.',
                'B) Inclusiones indebidas.',
                'C) Registros tardíos que deben excluirse.',
                'D) Sucesos de períodos anteriores que no afectan la estadística.'
            ],
            correct: 1,
            justification: 'El párrafo 277: "Los sucesos que ocurrieron durante el período dado pero registrados después de finalizar dicho período son omisiones, y los anteriores al comienzo del período pero registrados durante el mismo son inclusiones indebidas."',
            distractors: [
                'A) Las omisiones son los sucesos del período no registrados dentro de él.',
                'C) No se excluyen; se consideran inclusiones indebidas para ese período.',
                'D) Sí afectan la estadística del período de registro.'
            ]
        },
        {
            type: 'opcion',
            text: 'Según el párrafo 278, si en épocas anteriores un 25% de los nacimientos se registraban al año siguiente y las mejoras reducen ese porcentaje a cero en el año corriente, el número de nacimientos registrados en el año corriente:',
            options: [
                'A) Será exactamente igual al número real de nacimientos del año.',
                'B) Incluirá todos los nacimientos del año más un 25% de los del año anterior, produciendo un sobrerregistro del 25%.',
                'C) Subestimará los nacimientos del año en un 25%.',
                'D) No se verá afectado porque los registros se ajustan por fecha de acaecimiento.'
            ],
            correct: 1,
            justification: 'El párrafo 278: "Los nacimientos registrados en este año incluirán entonces todos los nacimientos del año más un 25% de todos los nacimientos del año anterior. Habrá un sobrerregistro de nacimientos del 25% en el año corriente."',
            distractors: [
                'A) No es exacto, hay un sobrerregistro.',
                'C) Hay sobrerregistro, no subestimación.',
                'D) El ejemplo es sobre registros por fecha de registro, no de acaecimiento.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 279 indica que a nivel subnacional, los errores de cobertura son más complicados porque:',
            options: [
                'A) La migración interna es difícil de medir.',
                'B) Puede no declararse con exactitud el lugar de residencia, y a veces se usa el lugar de acaecimiento como sustituto.',
                'C) Las oficinas locales tienen diferentes criterios de registro.',
                'D) Los registros tardíos son más frecuentes en áreas rurales.'
            ],
            correct: 1,
            justification: 'El párrafo 279: "Los procedimientos de control de calidad del sistema de registro civil deben asegurar que se declare con exactitud el lugar de residencia. Sin embargo, tal vez no sea así, y esto puede crear errores de cobertura en las zonas locales. Además, a veces los datos sobre el lugar de acaecimiento se usan como sustitutos de los datos sobre el lugar de residencia, lo que puede provocar elevados niveles de error de cobertura."',
            distractors: [
                'A) La migración no se menciona en este párrafo.',
                'C) No es el punto central del párrafo.',
                'D) Los registros tardíos son un problema general, no específicamente subnacional.'
            ]
        },
        {
            type: 'opcion',
            text: 'Según el párrafo 280, desde el punto de vista estadístico, un suceso queda registrado solamente si:',
            options: [
                'A) Se inscribe en la oficina local y se capta en la base de datos utilizada para producir tabulaciones.',
                'B) Se emite un certificado legal de nacimiento o defunción.',
                'C) El médico certificador firma el acta.',
                'D) Se notifica al organismo central dentro del plazo legal.'
            ],
            correct: 0,
            justification: 'El párrafo 280: "Desde el punto de vista estadístico, un suceso queda registrado solamente si: a) se lo inscribe en la oficina local, y b) si esta información se capta en la base de datos utilizada para producir tabulaciones y otras estadísticas; la inscripción de por sí no cuenta."',
            distractors: [
                'B) El certificado legal es parte del registro civil, pero no suficiente para la estadística.',
                'C) La firma del médico no garantiza la captura estadística.',
                'D) La notificación al organismo central no es suficiente si no se capta en la base de datos.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 281 señala una ventaja del registro civil sobre censos y encuestas:',
            options: [
                'A) La información se obtiene mucho después de ocurridos los sucesos, lo que permite mayor reflexión.',
                'B) La información se obtiene poco tiempo después de ocurridos los sucesos y a partir de un declarante que probablemente puede proporcionar datos exactos.',
                'C) El registro civil tiene mejor cobertura que los censos.',
                'D) El registro civil no requiere supervisión porque los declarantes son confiables.'
            ],
            correct: 1,
            justification: 'El párrafo 281: "El registro civil tiene como ventaja sobre los censos y las encuestas que la información se obtiene poco tiempo después de ocurridos los sucesos y a partir de un declarante que probablemente puede proporcionar datos exactos."',
            distractors: [
                'A) Es al revés: se obtiene poco tiempo después.',
                'C) No siempre es mejor; depende del país.',
                'D) Sí requiere supervisión y control de calidad.'
            ]
        },
        {
            type: 'opcion',
            text: 'En relación con la calidad de los datos del registro civil, el párrafo 276 destaca que:',
            options: [
                'A) La cobertura de los nacimientos y defunciones es siempre comparable.',
                'B) La calidad tiene que ver con la cobertura y el contenido, y la cobertura de las defunciones infantiles puede ser mucho más incompleta.',
                'C) El contenido es más importante que la cobertura.',
                'D) Los errores de cobertura son irrelevantes si el contenido es bueno.'
            ],
            correct: 1,
            justification: 'El párrafo 276: "La calidad de los datos de registro civil tiene que ver con la cobertura y el contenido... Cabe recalcar que la cobertura de los nacimientos quizás sea muy diferente de las de las defunciones y que cuando es incompleta es posible que el registro de defunciones de menores de un año lo sea en medida mucho mayor que el de otras defunciones."',
            distractors: [
                'A) No siempre son comparables.',
                'C) Ambas dimensiones son importantes.',
                'D) Ambos tipos de errores afectan la calidad.'
            ]
        },
        {
            type: 'opcion',
            text: 'Según el párrafo 278, un cambio en la demora entre el acaecimiento y el registro puede provocar:',
            options: [
                'A) Subregistro sistemático de nacimientos.',
                'B) Variaciones en las estimaciones que pueden ser demasiado grandes o demasiado pequeñas.',
                'C) Mejora automática de la cobertura.',
                'D) Mayor exactitud en la causa de muerte.'
            ],
            correct: 1,
            justification: 'El párrafo 278: "Por lo tanto, las variaciones en la modalidad de retraso entre el acaecimiento y el registro de sucesos pueden provocar estimaciones demasiado grandes o demasiado pequeñas."',
            distractors: [
                'A) No necesariamente, puede haber sobrerregistro en algunos períodos.',
                'C) No es automático; depende de la dirección del cambio.',
                'D) No se relaciona con la causa de muerte.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 277 establece que cuando se tabulan por fecha de registro, los sucesos ocurridos durante el período pero registrados después de finalizado son considerados:',
            options: [
                'A) Inclusiones indebidas.',
                'B) Omisiones del período.',
                'C) Registros válidos que deben incluirse.',
                'D) Sucesos que deben excluirse del análisis.'
            ],
            correct: 1,
            justification: 'Párrafo 277: "Los sucesos que ocurrieron durante el período dado pero registrados después de finalizar dicho período son omisiones."',
            distractors: [
                'A) Esa es la definición para sucesos anteriores al período pero registrados en él.',
                'C) No son válidos para el período por fecha de registro.',
                'D) No se excluyen, se contabilizan como omisiones.'
            ]
        },
        // ---- Errores en la distribución por edades (párrafos 407-421) ----
        {
            type: 'opcion',
            text: 'El párrafo 408 explica que para visualizar los errores en la declaración de la edad, es útil imaginar un cuadro de doble entrada con:',
            options: [
                'A) Edad declarada en filas y edad verdadera en columnas.',
                'B) Edad verdadera en filas y edad declarada en columnas.',
                'C) Edad en años completos y edad en meses.',
                'D) Edad al momento del censo y edad al momento del registro.'
            ],
            correct: 1,
            justification: 'Párrafo 408: "Para visualizar este tipo de error es útil imaginar un cuadro que muestre la población en cuestión clasificada por la edad verdadera (filas) y la edad declarada (columnas)."',
            distractors: [
                'A) Invierte el orden correcto.',
                'C) No es la representación que se menciona.',
                'D) No corresponde al ejemplo del párrafo.'
            ]
        },
        {
            type: 'opcion',
            text: 'Según el párrafo 408, si no hubiera error en la declaración de la edad, el cuadro de edad verdadera vs. edad declarada:',
            options: [
                'A) Tendría valores en todas las celdas, distribuidos uniformemente.',
                'B) Solo tendría valores distintos de cero en la diagonal principal.',
                'C) Tendría más valores por encima de la diagonal.',
                'D) Sería simétrico.'
            ],
            correct: 1,
            justification: 'Párrafo 408: "Si no hubiera error, el cuadro solamente tendría asientos distintos de cero en la diagonal que va desde la casilla superior izquierda hasta la inferior derecha."',
            distractors: [
                'A) No, solo en la diagonal.',
                'C) No, solo en la diagonal.',
                'D) No, solo en la diagonal.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 409 indica que el número declarado de personas de edad x puede diferir del número verdadero debido a:',
            options: [
                'A) La preferencia por edades terminadas en 0 y 5 solamente.',
                'B) La transferencia neta de personas a esa edad desde otras edades por declaraciones inexactas.',
                'C) La omisión de personas en todas las edades por igual.',
                'D) La falta de preguntas sobre edad en el cuestionario.'
            ],
            correct: 1,
            justification: 'Párrafo 409: "el número declarado de personas de edad x será la cantidad cuya verdadera edad es x más la cantidad neta de personas transferidas a esta edad desde otras debido a declaraciones inexactas."',
            distractors: [
                'A) La preferencia de dígitos es una forma, no la única.',
                'C) La omisión no es igual en todas las edades.',
                'D) No es el tema del párrafo.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 410 identifica la preferencia de edades terminadas en ciertos dígitos como:',
            options: [
                'A) La forma más importante de subdeclaración de edad.',
                'B) La forma más conocida pero menos importante de subdeclaración.',
                'C) Un error que solo afecta a los adultos jóvenes.',
                'D) Un error que no tiene consecuencias en las estimaciones demográficas.'
            ],
            correct: 1,
            justification: 'Párrafo 410: "La preferencia de edades terminadas en ciertos dígitos, donde una cantidad excesiva de personas informan tener edades terminadas en “0” y “5” es la forma de subdeclaración más conocida pero menos importante."',
            distractors: [
                'A) Es la más conocida, pero no la más importante.',
                'C) Afecta principalmente a edades avanzadas, no solo a jóvenes.',
                'D) Sí tiene consecuencias, aunque menores que otras.'
            ]
        },
        {
            type: 'opcion',
            text: 'Según el párrafo 411, las formas más importantes de subdeclaración de la edad incluyen:',
            options: [
                'A) Exagerar la edad de los niños pequeños.',

            correct: 1,

                'D) No se menciona como una de las más importantes.'
            ]
        },
        {

            text: 'El párrafo 412 señala que las edades de los niños (menores de 1 y de 5 años) suelen aumentarse al declararlas, lo que produce:',
            options: [
                'A) Un excedente neto de personas en los grupos de edades más jóvenes.',

                'D) Un aumento en la relación de masculinidad.'

            correct: 1,
            justification: 'Párrafo 412: "Las edades de los niños (menores de 1 y de 5 años) suelen aumentarse al declararlas, lo que produce un déficit neto de personas en los grupos de edades más jóvenes."',

            text: 'El párrafo 411 menciona que las formas más importantes de subdeclaración de la edad incluyen el aumento de la edad de niños pequeños, la modificación de la edad de mujeres jóvenes según estado civil y paridez, y:',
            options: [
                'A) La preferencia por edades terminadas en 0.',
                'B) La exageración de la edad de los ancianos.',
                'C) La omisión de personas mayores.',
                'D) La declaración de edad en meses.'
            ],
            correct: 1,
            justification: 'Párrafo 411: "c) cuando se exagera la edad de los ancianos."',
            distractors: [
                'A) Esa es la preferencia de dígitos, considerada menos importante.',
                'C) No se menciona como una de las más importantes.',
                'D) No es una forma de subdeclaración.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 412 señala que el aumento de la edad declarada de niños pequeños produce un déficit en los grupos de edades más jóvenes, lo que afecta las estimaciones de:',
            options: [
                'A) Mortalidad infantil.',
                'B) Fecundidad reciente.',
                'C) Migración.',
                'D) Nupcialidad.'
            ],
            correct: 1,
            justification: 'Párrafo 412: "esto produce estimaciones demasiado bajas para el período inmediatamente anterior al censo o a la encuesta, creándose así una aparente disminución de la fecundidad."',
            distractors: [
                'A) Puede afectar indirectamente, pero el texto menciona fecundidad.',
                'C) No se menciona.',
                'D) No se menciona.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 416 subraya que la calidad de los datos de edad se ve afectada por el subempadronamiento selectivo por edades, que distorsiona la distribución por edad declarada de la población empadronada, mientras que los errores de declaración distorsionan:',
            options: [
                'A) La edad verdadera.',
                'B) La edad declarada.',
                'C) La relación entre edad verdadera y declarada.',
                'D) El tamaño de la población.'
            ],
            correct: 2,
            justification: 'Párrafo 416: "ambos tipos de errores se combinan para producir diferencias en a) la distribución por edad declarada de la población empadronada y b) en la auténtica distribución por edades de la 'verdadera' población." Es decir, afectan la relación entre ambas.',
            distractors: [
                'A) No, la edad verdadera es desconocida.',
                'B) Sí, pero el texto dice que ambos se combinan.',
                'D) No directamente.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 551 menciona que los datos de historiales de nacimientos suelen procesarse de manera que produzcan directamente las medidas deseadas, a diferencia de otras preguntas que:',
            options: [
                'A) Se procesan de manera similar.',
                'B) Requieren tabulaciones intermedias para luego estimar.',
                'C) No necesitan procesamiento.',
                'D) Se procesan con más detalle.'
            ],
            correct: 1,
            justification: 'Párrafo 551: "Los datos de los historiales de nacimientos no suelen procesarse de la misma manera que los de las otras preguntas... los datos de los historiales de nacimientos suelen procesarse de manera que produzcan directamente las medidas deseadas."',
            distractors: [
                'A) Es diferente.',
                'C) Sí necesitan procesamiento.',
                'D) No se especifica que sea con más detalle.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 554 concluye que la transferencia de nacimientos de años recientes a años anteriores es un error grave porque:',
            options: [
                'A) Produce una aparente disminución de la fecundidad que puede ser malinterpretada.',
                'B) Aumenta la fecundidad real.',
                'C) No afecta las tendencias.',
                'D) Mejora la calidad de los datos.'
            ],
            correct: 0,
            justification: 'Párrafo 554-555: "Esto tiene el efecto de subvalorar el nivel de fecundidad de los años inmediatamente precedentes... Como consecuencia, aparecerá una disminución de la fecundidad, cuando en realidad se ha mantenido constante."',
            distractors: [
                'B) Es lo opuesto.',
                'C) Sí afecta las tendencias.',
                'D) Empeora la calidad.'
            ]
        },
        {
            type: 'opcion',
            text: 'El párrafo 556 explica que la exclusión de mujeres mayores de 50 años en los historiales de nacimientos implica que, para períodos anteriores, los datos se basan en mujeres más jóvenes, lo que puede introducir un sesgo en las estimaciones de fecundidad debido a:',
            options: [
                'A) La menor fecundidad de las mujeres jóvenes.',
                'B) La mayor fecundidad de las mujeres jóvenes en comparación con las mayores.',
                'C) La diferente estructura de fecundidad por edad de las cohortes incluidas.',
                'D) La menor mortalidad de las mujeres jóvenes.'
            ],
            correct: 2,
            justification: 'El sesgo de selección por edades implica que para períodos más lejanos solo se incluyen mujeres jóvenes, por lo que la estructura de fecundidad por edad de la muestra no representa a toda la población, alterando las estimaciones de fecundidad total.',
            distractors: [
                'A) No es necesariamente menor, pero el sesgo es por la estructura.',
                'B) No es el punto principal.',
                'D) No se menciona mortalidad aquí.'
            ]
        }
    ];

    // ========== LÓGICA DEL EXAMEN ==========
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    const totalQuestions = questions.length;

    const qNumber = document.getElementById('qNumber');
    const qText = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const fbTitle = document.getElementById('fbTitle');
    const fbDetail = document.getElementById('fbDetail');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const questionArea = document.getElementById('questionArea');
    const resultArea = document.getElementById('resultArea');
    const finalScore = document.getElementById('finalScore');
    const finalMsg = document.getElementById('finalMsg');
    const restartBtn = document.getElementById('restartBtn');

    function renderQuestion(index) {
        const q = questions[index];
        qNumber.textContent = `Pregunta ${index+1} de ${totalQuestions}`;
        qText.textContent = q.text;
        optionsContainer.innerHTML = '';
        feedback.className = 'feedback';
        feedback.style.display = 'none';
        nextBtn.disabled = true;
        answered = false;

        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.dataset.index = i;
            div.innerHTML = `<span class="option-letter">${letters[i]}</span> ${opt.substring(3)}`;
            div.addEventListener('click', () => selectOption(i));
            optionsContainer.appendChild(div);
        });

        updateProgress();
    }

    function selectOption(selected) {
        if (answered) return;
        const q = questions[currentIndex];
        const options = document.querySelectorAll('.option');
        options.forEach((el, i) => {
            el.classList.add('disabled');
            if (i === q.correct) el.classList.add('correct');
            if (i === selected && i !== q.correct) el.classList.add('wrong');
            if (i === selected) el.classList.add('selected');
        });

        const isCorrect = (selected === q.correct);
        if (isCorrect) score++;

        // Mostrar feedback
        feedback.style.display = 'block';
        if (isCorrect) {
            feedback.className = 'feedback correct';
            fbTitle.textContent = '✅ Correcto';
        } else {
            feedback.className = 'feedback wrong';
            fbTitle.textContent = '❌ Incorrecto';
        }
        let detail = `<strong>Justificación:</strong> ${q.justification}<br><br>`;
        detail += `<strong>Análisis de distractores:</strong><br>`;
        q.distractors.forEach((d, i) => {
            const letter = String.fromCharCode(65 + i);
            detail += `• ${letter}: ${d}<br>`;
        });
        fbDetail.innerHTML = detail;

        answered = true;
        nextBtn.disabled = false;
        updateProgress();
    }

    function nextQuestion() {
        if (currentIndex < totalQuestions - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const pct = ((currentIndex + (answered ? 1 : 0)) / totalQuestions) * 100;
        progressFill.style.width = `${Math.min(pct, 100)}%`;
    }

    function showResults() {
        questionArea.classList.add('hidden');
        resultArea.classList.remove('hidden');
        const pct = Math.round((score / totalQuestions) * 100);
        finalScore.textContent = `${pct}%`;
        let msg = '';
        if (pct === 100) msg = '🏆 ¡Excelente! Dominas perfectamente los conceptos del manual.';
        else if (pct >= 80) msg = '🌟 Muy bien. Tienes un sólido entendimiento de los temas.';
        else if (pct >= 60) msg = '📘 Buen esfuerzo. Revisa los temas donde fallaste para profundizar.';
        else msg = '📖 Te recomendamos repasar las secciones indicadas y volver a intentarlo.';
        finalMsg.textContent = msg;
    }

    function restart() {
        currentIndex = 0;
        score = 0;
        answered = false;
        questionArea.classList.remove('hidden');
        resultArea.classList.add('hidden');
        renderQuestion(0);
    }

    // Eventos
    nextBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restart);

    // Iniciar
    renderQuestion(0);
</script>
