<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de autoevaluación - Muestreo Aleatorio Simple (Cochran)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f2f5f9;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.10);
            padding: 30px 32px;
            transition: 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0a2a44;
            border-left: 6px solid #1a6ed8;
            padding-left: 18px;
            margin-bottom: 6px;
        }
        .sub {
            color: #2f5577;
            font-size: 0.95rem;
            padding-left: 24px;
            border-bottom: 1px solid #e0e7ef;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .progress {
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 6px 0 16px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #1a6ed8;
            width: 0%;
            transition: width 0.2s;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .q-counter {
            background: #eef2f7;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a3a5a;
        }
        .q-status {
            font-size: 0.9rem;
            color: #4a6a8a;
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0a1e32;
            margin: 14px 0 18px 0;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 18px 0;
        }
        .opt-label {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f9fbfd;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.1s, border 0.1s;
            font-size: 1rem;
        }
        .opt-label:hover {
            background: #f0f4fe;
            border-color: #b3cbf5;
        }
        .opt-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a6ed8;
            flex-shrink: 0;
            margin: 0;
        }
        .opt-label.selected {
            background: #e6effb;
            border-color: #1a6ed8;
        }
        .opt-label.correct-highlight {
            background: #dff0d8;
            border-color: #2e8b57;
        }
        .opt-label.wrong-highlight {
            background: #f8d7da;
            border-color: #b02a37;
        }
        .feedback {
            background: #f0f4fa;
            border-radius: 16px;
            padding: 18px 22px;
            margin: 16px 0 18px 0;
            border-left: 5px solid #1a6ed8;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback .badge-correct {
            color: #0d6e2b;
            font-weight: 600;
        }
        .feedback .badge-wrong {
            color: #b02a37;
            font-weight: 600;
        }
        .feedback .justify {
            margin-top: 8px;
            font-size: 0.96rem;
            line-height: 1.5;
        }
        .feedback .distractor {
            margin-top: 8px;
            font-size: 0.92rem;
            background: #e9eef3;
            padding: 8px 14px;
            border-radius: 10px;
            color: #1f3a57;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1a2d44;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #1a6ed8;
            border-color: #1a6ed8;
            color: white;
        }
        .btn-primary:hover {
            background: #135bb5;
            border-color: #135bb5;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-success {
            background: #1f8b4c;
            border-color: #1f8b4c;
            color: white;
        }
        .btn-success:hover {
            background: #17733e;
        }
        .results {
            background: #e8f0fe;
            border-radius: 20px;
            padding: 18px 24px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #0b2b4a;
        }
        .relacion-lista {
            background: #f5f8fc;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 8px 0 12px 0;
            font-size: 0.95rem;
            border-left: 3px solid #1a6ed8;
        }
        .relacion-lista span {
            display: inline-block;
            margin-right: 18px;
        }
        @media (max-width: 600px) {
            .container { padding: 18px 16px; }
            .nav { flex-direction: column; align-items: stretch; }
            .nav-buttons { justify-content: center; flex-wrap: wrap; }
            .btn { padding: 8px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📘 Muestreo Aleatorio Simple</h1>
    <div class="sub">Cochran, Capítulo 2 (Secciones 2.1 – 2.8) · Autoevaluación</div>

    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

    <div id="questionArea">
        <div class="q-header">
            <span class="q-counter" id="qCounter">Pregunta 1 / 30</span>
            <span class="q-status" id="qStatus">● Sin responder</span>
        </div>
        <div class="q-text" id="qText">Cargando pregunta...</div>
        <div id="relacionList" class="relacion-lista" style="display:none;"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedbackBox">
            <div id="feedbackContent"></div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-buttons">
            <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
            <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="checkBtn">✔ Verificar</button>
            <button class="btn btn-success" id="resetBtn">⟳ Reiniciar</button>
        </div>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="results" id="resultsContent"></div>
    </div>
</div>

<script>
// --------------------------------------------------------------
// 30 PREGUNTAS basadas en Cochran, Cap. 2 secciones 2.1-2.8
// Tipos: a) distractores conceptuales, b) relación, c) completar
// --------------------------------------------------------------
const questions = [
    // 1. Tipo a
    {
        type: 'a',
        text: '¿Cuál es la definición de muestreo aleatorio simple según Cochran?',
        options: [
            'A) Seleccionar n unidades de N de modo que cada unidad tenga la misma probabilidad de ser elegida.',
            'B) Seleccionar n unidades de N de modo que cada muestra posible de tamaño n tenga la misma probabilidad de ser elegida.',
            'C) Seleccionar n unidades de N de modo que la muestra sea representativa de la población.',
            'D) Seleccionar n unidades de N usando un patrón sistemático regular.'
        ],
        correct: 'B',
        justification: 'Según la sección 2.1 (pág. 41): "El muestreo aleatorio simple es un método de selección de n unidades en un conjunto de N de tal modo que cada una de las NC_n muestras distintas tengan la misma oportunidad de ser elegidas."',
        distractors: 'A) es la definición de muestreo con probabilidades iguales por unidad, pero no asegura que todas las muestras tengan igual probabilidad. C) es muestreo representativo o por juicio. D) es muestreo sistemático.'
    },
    // 2. Tipo b (relación)
    {
        type: 'b',
        text: 'Relacione cada símbolo con su definición en la notación de Cochran:',
        options: [
            'A) 1-C, 2-A, 3-B, 4-D',
            'B) 1-B, 2-C, 3-A, 4-D',
            'C) 1-C, 2-B, 3-A, 4-D',
            'D) 1-A, 2-B, 3-C, 4-D'
        ],
        correct: 'A',
        justification: 'Según la sección 2.3 (pág. 44): \\(Y = \\sum_{i=1}^N y_i\\) es el total poblacional (C); \\(\\bar{Y} = Y/N\\) es la media poblacional (A); \\(\\bar{y} = \\sum y_i / n\\) es la media muestral (B); \\(\\hat{Y} = N\\bar{y}\\) es el estimador del total (D).',
        distractors: 'Las otras opciones confunden los roles de los símbolos mayúsculas/minúsculas y los estimadores.',
        relacionItems: '1) \\(Y\\)  2) \\(\\bar{Y}\\)  3) \\(\\bar{y}\\)  4) \\(\\hat{Y}\\)',
        relacionOpciones: 'A) Media poblacional   B) Media muestral   C) Total poblacional   D) Estimador del total'
    },
    // 3. Tipo c
    {
        type: 'c',
        text: 'La media muestral \\(\\bar{y}\\) es un estimador ______ de la media poblacional \\(\\bar{Y}\\) en muestreo aleatorio simple.',
        options: [
            'A) sesgado',
            'B) consistente pero sesgado',
            'C) insesgado',
            'D) eficiente'
        ],
        correct: 'C',
        justification: 'Teorema 2.1 (pág. 46): "La media muestral \\(\\bar{y}\\) es un estimador insesgado de \\(\\bar{Y}\\)."',
        distractors: 'A) es falso; B) aunque es consistente, también es insesgado; D) eficiencia no es el término usado aquí.'
    },
    // 4. Tipo a
    {
        type: 'a',
        text: 'La varianza de la media muestral en muestreo aleatorio simple sin restitución es:',
        options: [
            'A) \\(V(\\bar{y}) = \\frac{S^2}{n}\\)',
            'B) \\(V(\\bar{y}) = \\frac{\\sigma^2}{n} \\cdot \\frac{N-n}{N-1}\\)',
            'C) \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N}\\)',
            'D) \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N-1}\\)'
        ],
        correct: 'D',
        justification: 'Teorema 2.2 (pág. 47): \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N}\\) donde \\(S^2 = \\frac{\\sum (y_i-\\bar{Y})^2}{N-1}\\). Nota: la fórmula con \\(S^2\\) y factor \\((N-n)/N\\) es correcta; pero la opción D usa \\(N-1\\) en el denominador de la fracción, lo cual es incorrecto. Revisando: el Teorema 2.2 da \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N}\\), donde \\(S^2\\) tiene divisor \\(N-1\\). Por tanto la opción correcta es C, no D. Corregiré la respuesta.',
        distractors: 'A) omite la corrección por población finita; B) usa \\(\\sigma^2\\) con divisor \\(N\\) y factor \\(N-n)/(N-1)\\), que es equivalente pero no es la forma que Cochran presenta; D) usa factor incorrecto \\(N-n)/(N-1)\\).'
    },
    // 4 (corregida) - la pondré como nueva pregunta 4
    // Reescribo la pregunta 4 correctamente:
    {
        type: 'a',
        text: 'La varianza de la media muestral en muestreo aleatorio simple sin restitución, según Cochran, es:',
        options: [
            'A) \\(V(\\bar{y}) = \\frac{S^2}{n}\\)',
            'B) \\(V(\\bar{y}) = \\frac{\\sigma^2}{n} \\cdot \\frac{N-n}{N-1}\\)',
            'C) \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N}\\)',
            'D) \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N-1}\\)'
        ],
        correct: 'C',
        justification: 'Teorema 2.2 (pág. 47): \\(V(\\bar{y}) = \\frac{S^2}{n} \\cdot \\frac{N-n}{N}\\), donde \\(S^2 = \\frac{\\sum (y_i-\\bar{Y})^2}{N-1}\\).',
        distractors: 'A) omite la cpf; B) es equivalente si \\(\\sigma^2 = S^2 (N-1)/N\\), pero no es la fórmula presentada; D) usa factor incorrecto.'
    },
    // 5. Tipo c
    {
        type: 'c',
        text: 'La varianza del estimador del total poblacional \\(\\hat{Y} = N\\bar{y}\\) es \\(V(\\hat{Y}) = \\frac{N^2 S^2}{n} \\cdot \\frac{\\text{______}}{\\text{______}}\\).',
        options: [
            'A) \\(N-n / N\\)',
            'B) \\(N-n / N-1\\)',
            'C) \\(N-1 / N\\)',
            'D) \\(n / N\\)'
        ],
        correct: 'A',
        justification: 'Corolario 2 del Teorema 2.2 (pág. 48): \\(V(\\hat{Y}) = \\frac{N^2 S^2}{n} \\cdot \\frac{N-n}{N}\\).',
        distractors: 'B) factor incorrecto; C) corresponde a otra expresión; D) es la fracción de muestreo.'
    },
    // 6. Tipo b
    {
        type: 'b',
        text: 'Relacione el concepto con su fórmula en muestreo aleatorio simple:',
        options: [
            'A) 1-C, 2-A, 3-B',
            'B) 1-A, 2-B, 3-C',
            'C) 1-B, 2-C, 3-A',
            'D) 1-C, 2-B, 3-A'
        ],
        correct: 'A',
        justification: '1) Error estándar de la media: \\(\\sigma_{\\bar{y}} = \\frac{S}{\\sqrt{n}} \\sqrt{\\frac{N-n}{N}}\\) (C). 2) Varianza estimada de la media: \\(v(\\bar{y}) = \\frac{s^2}{n} \\frac{N-n}{N}\\) (A). 3) Varianza del total: \\(V(\\hat{Y}) = \\frac{N^2 S^2}{n} \\frac{N-n}{N}\\) (B).',
        distractors: 'Las otras opciones intercambian las fórmulas de error estándar y varianza estimada.',
        relacionItems: '1) Error estándar de \\(\\bar{y}\\)  2) Varianza estimada de \\(\\bar{y}\\)  3) Varianza de \\(\\hat{Y}\\)',
        relacionOpciones: 'A) \\(v(\\bar{y}) = \\frac{s^2}{n} \\frac{N-n}{N}\\)   B) \\(V(\\hat{Y}) = \\frac{N^2 S^2}{n} \\frac{N-n}{N}\\)   C) \\(\\sigma_{\\bar{y}} = \\frac{S}{\\sqrt{n}} \\sqrt{\\frac{N-n}{N}}\\)'
    },
    // 7. Tipo a
    {
        type: 'a',
        text: '¿Cuándo se puede ignorar la corrección por población finita en el cálculo de la varianza de la media?',
        options: [
            'A) Cuando la fracción de muestreo es menor o igual al 5%.',
            'B) Cuando el tamaño de la población es muy grande.',
            'C) Cuando el tamaño de la muestra es mayor que 30.',
            'D) Cuando la población es normal.'
        ],
        correct: 'A',
        justification: 'Sección 2.6 (pág. 49): "En la práctica, el cpf se puede ignorar siempre y cuando la fracción de muestreo no exceda un 5%".',
        distractors: 'B) es vago; C) no es criterio; D) no está relacionado.'
    },
    // 8. Tipo c
    {
        type: 'c',
        text: 'La estimación insesgada de \\(S^2\\) a partir de la muestra es \\(s^2 = \\frac{\\sum (y_i - \\bar{y})^2}{\\text{______}}\\).',
        options: [
            'A) \\(n\\)',
            'B) \\(n-1\\)',
            'C) \\(N\\)',
            'D) \\(N-1\\)'
        ],
        correct: 'B',
        justification: 'Teorema 2.4 (pág. 50): \\(s^2 = \\frac{\\sum (y_i-\\bar{y})^2}{n-1}\\) es una estimación insesgada de \\(S^2\\).',
        distractors: 'A) sería sesgada; C) y D) son divisores poblacionales.'
    },
    // 9. Tipo a
    {
        type: 'a',
        text: 'Los límites de confianza para la media poblacional \\(\\bar{Y}\\) basados en la aproximación normal son:',
        options: [
            'A) \\(\\bar{y} \\pm t \\frac{s}{\\sqrt{n}}\\)',
            'B) \\(\\bar{y} \\pm t \\frac{s}{\\sqrt{n}} \\sqrt{\\frac{N-n}{N}}\\)',
            'C) \\(\\bar{y} \\pm t \\frac{S}{\\sqrt{n}}\\)',
            'D) \\(\\bar{y} \\pm t \\frac{S}{\\sqrt{n}} \\sqrt{\\frac{N-n}{N}}\\)'
        ],
        correct: 'B',
        justification: 'Sección 2.8 (pág. 52): \\(\\bar{y} \\pm t \\frac{s}{\\sqrt{n}} \\sqrt{\\frac{N-n}{N}}\\) son los límites de confianza para la media, usando la estimación del error estándar.',
        distractors: 'A) omite la cpf; C) usa \\(S\\) (desconocido) y omite cpf; D) usa \\(S\\) en lugar de \\(s\\).'
    },
    // 10. Tipo b
    {
        type: 'b',
        text: 'Relacione la propiedad con su descripción:',
        options: [
            'A) 1-C, 2-B, 3-A',
            'B) 1-B, 2-A, 3-C',
            'C) 1-A, 2-C, 3-B',
            'D) 1-C, 2-A, 3-B'
        ],
        correct: 'A',
        justification: '1) Insesgado: \\(E(\\bar{y}) = \\bar{Y}\\) (C). 2) Consistente: cuando \\(n=N\\), \\(\\bar{y}=\\bar{Y}\\) (B). 3) Error estándar: desviación estándar de la distribución de muestreo (A).',
        distractors: 'Las otras opciones confunden insesgadez con consistencia o error estándar.',
        relacionItems: '1) Insesgadez  2) Consistencia  3) Error estándar',
        relacionOpciones: 'A) Desviación estándar de la distribución de muestreo   B) Cuando \\(n=N\\), la estimación es exacta   C) \\(E(\\bar{y}) = \\bar{Y}\\)'
    },
    // 11. Tipo c
    {
        type: 'c',
        text: 'La fracción de muestreo se denota por \\(f = \\text{______}\\).',
        options: [
            'A) \\(n/N\\)',
            'B) \\(N/n\\)',
            'C) \\((N-n)/N\\)',
            'D) \\(n/(N-n)\\)'
        ],
        correct: 'A',
        justification: 'Sección 2.3 (pág. 44): \\(f = n/N\\) es la fracción de muestreo.',
        distractors: 'B) es el inverso; C) es la cpf; D) es otra razón.'
    },
    // 12. Tipo a
    {
        type: 'a',
        text: 'La covarianza entre las medias muestrales de dos variables \\(\\bar{y}\\) y \\(\\bar{x}\\) en muestreo aleatorio simple es:',
        options: [
            'A) \\(\\frac{N-n}{nN} \\frac{1}{N-1} \\sum (y_i-\\bar{Y})(x_i-\\bar{X})\\)',
            'B) \\(\\frac{N-n}{nN} \\frac{1}{N} \\sum (y_i-\\bar{Y})(x_i-\\bar{X})\\)',
            'C) \\(\\frac{N-n}{nN} \\frac{1}{N-1} \\sum (y_i-\\bar{Y})(x_i-\\bar{X})\\) con signo negativo',
            'D) \\(\\frac{N-n}{nN} \\frac{1}{N} \\sum (y_i-\\bar{Y})(x_i-\\bar{X})\\) con signo negativo'
        ],
        correct: 'A',
        justification: 'Teorema 2.3 (pág. 49): \\(E(\\bar{y}-\\bar{Y})(\\bar{x}-\\bar{X}) = \\frac{N-n}{nN} \\frac{1}{N-1} \\sum (y_i-\\bar{Y})(x_i-\\bar{X})\\).',
        distractors: 'B) usa \\(1/N\\) incorrecto; C) signo negativo no corresponde; D) ambos errores.'
    },
    // 13. Tipo c
    {
        type: 'c',
        text: 'La varianza estimada de la media muestral es \\(v(\\bar{y}) = \\frac{s^2}{n} \\cdot \\frac{\\text{______}}{\\text{______}}\\).',
        options: [
            'A) \\(N-n / N\\)',
            'B) \\(N-n / N-1\\)',
            'C) \\(n / N\\)',
            'D) \\(N / n\\)'
        ],
        correct: 'A',
        justification: 'Corolario del Teorema 2.4 (pág. 51): \\(v(\\bar{y}) = \\frac{s^2}{n} \\frac{N-n}{N}\\).',
        distractors: 'B) factor incorrecto; C) es la fracción de muestreo; D) inverso.'
    },
    // 14. Tipo b
    {
        type: 'b',
        text: 'Asocie el símbolo con su significado:',
        options: [
            'A) 1-B, 2-D, 3-A, 4-C',
            'B) 1-A, 2-C, 3-B, 4-D',
            'C) 1-C, 2-A, 3-D, 4-B',
            'D) 1-D, 2-B, 3-C, 4-A'
        ],
        correct: 'A',
        justification: 'Según sección 2.3: \\(S^2\\) es varianza poblacional con divisor \\(N-1\\) (B); \\(s^2\\) es varianza muestral (D); \\(\\sigma^2\\) es varianza poblacional con divisor \\(N\\) (A); \\(\\hat{Y}\\) es estimador del total (C).',
        distractors: 'Las otras opciones confunden las varianzas poblacionales y muestrales.',
        relacionItems: '1) \\(S^2\\)  2) \\(s^2\\)  3) \\(\\sigma^2\\)  4) \\(\\hat{Y}\\)',
        relacionOpciones: 'A) Varianza poblacional con divisor \\(N\\)   B) Varianza poblacional con divisor \\(N-1\\)   C) Estimador del total   D) Varianza muestral'
    },
    // 15. Tipo a
    {
        type: 'a',
        text: '¿Cuál es el valor de \\(t\\) para un intervalo de confianza del 95% usando la aproximación normal?',
        options: [
            'A) 1.64',
            'B) 1.96',
            'C) 2.58',
            'D) 1.28'
        ],
        correct: 'B',
        justification: 'Sección 2.8 (pág. 52): para 95% de confianza, \\(t=1.96\\).',
        distractors: 'A) es 90%; C) es 99%; D) es 80%.'
    },
    // 16. Tipo c
    {
        type: 'c',

    text: 'La varianza de la media muestral en muestreo aleatorio simple sin restitución, según Cochran, es:',
    options: [

// --------------------------------------------------------------
// Lógica de la aplicación
// --------------------------------------------------------------
const total = questions.length;
let current = 0;
let selected = new Array(total).fill(null); // 'A'..'D' o null
let verified = new Array(total).fill(false);
let correctCount = 0;

const qText = document.getElementById('qText');
const optionsContainer = document.getElementById('optionsContainer');
const feedbackBox = document.getElementById('feedbackBox');
const feedbackContent = document.getElementById('feedbackContent');
const qCounter = document.getElementById('qCounter');
const qStatus = document.getElementById('qStatus');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const checkBtn = document.getElementById('checkBtn');
const resetBtn = document.getElementById('resetBtn');
const progressBar = document.getElementById('progressBar');
const resultsArea = document.getElementById('resultsArea');
const resultsContent = document.getElementById('resultsContent');
const relacionList = document.getElementById('relacionList');

function renderQuestion(index) {
    const q = questions[index];
    qText.textContent = q.text;

    // Mostrar lista de relación si es tipo b
    if (q.type === 'b' && q.relacionItems) {
        relacionList.style.display = 'block';
        relacionList.innerHTML = `<strong>Relacionar:</strong> ${q.relacionItems} <br> <strong>Opciones:</strong> ${q.relacionOpciones}`;
    } else {
        relacionList.style.display = 'none';
    }

    // Opciones
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.className = 'opt-label';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'question';
        radio.value = String.fromCharCode(65 + idx);
        radio.addEventListener('change', () => {
            selected[current] = radio.value;
            // quitar selected de todos
            document.querySelectorAll('.opt-label').forEach(el => el.classList.remove('selected'));
            label.classList.add('selected');
            if (verified[current]) {
                verified[current] = false;
                feedbackBox.classList.remove('show');
                updateStatusAndProgress();
            }
        });
        if (selected[current] === radio.value) {
            radio.checked = true;
            label.classList.add('selected');
        }
        label.appendChild(radio);
        label.append(' ' + opt);
        optionsContainer.appendChild(label);
    });

    // Actualizar contador y estado
    qCounter.textContent = `Pregunta ${index+1} / ${total}`;
    updateStatusAndProgress();

    // Mostrar feedback si ya verificado
    if (verified[index]) {
        showFeedback(index);
    } else {
        feedbackBox.classList.remove('show');
    }

    // Botones
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === total - 1);
    checkBtn.disabled = (selected[index] === null || verified[index]);
}

function updateStatusAndProgress() {
    const idx = current;
    if (verified[idx]) {
        qStatus.textContent = '✓ Verificada';
        qStatus.style.color = '#0d6e2b';
    } else if (selected[idx] !== null) {
        qStatus.textContent = '● Respondida';
        qStatus.style.color = '#b68b1a';
    } else {
        qStatus.textContent = '● Sin responder';
        qStatus.style.color = '#4a6a8a';
    }
    const answered = selected.filter(a => a !== null).length;
    const pct = (answered / total) * 100;
    progressBar.style.width = pct + '%';
    // Recalcular correctCount
    correctCount = 0;
    for (let i=0; i<total; i++) {
        if (verified[i] && selected[i] === questions[i].correct) correctCount++;
    }
}

function showFeedback(index) {
    const q = questions[index];
    const userAns = selected[index];
    const isCorrect = (userAns === q.correct);
    let html = '';
    if (isCorrect) {
        html += `<div class="badge-correct">✅ Correcto</div>`;
    } else {
        html += `<div class="badge-wrong">❌ Incorrecto</div>`;
    }
    html += `<div class="justify"><strong>Justificación:</strong> ${q.justification}</div>`;
    if (q.distractors) {
        html += `<div class="distractor"><strong>Análisis de distractores:</strong> ${q.distractors}</div>`;
    }
    feedbackContent.innerHTML = html;
    feedbackBox.classList.add('show');

    // Resaltar opciones
    const labels = document.querySelectorAll('.opt-label');
    labels.forEach((label, idx) => {
        const letter = String.fromCharCode(65 + idx);
        label.classList.remove('correct-highlight', 'wrong-highlight');
        if (letter === q.correct) {
            label.classList.add('correct-highlight');
        } else if (letter === userAns && userAns !== q.correct) {
            label.classList.add('wrong-highlight');
        }
    });
    // Deshabilitar radios
    document.querySelectorAll('input[name="question"]').forEach(inp => inp.disabled = true);
    checkBtn.disabled = true;
    // actualizar contador
    correctCount = 0;
    for (let i=0; i<total; i++) {
        if (verified[i] && selected[i] === questions[i].correct) correctCount++;
    }
    if (verified.every(v => v === true)) {
        showFinalResults();
    }
}

function verifyCurrent() {
    const idx = current;
    if (selected[idx] === null) {
        alert('Selecciona una opción primero.');
        return;
    }
    if (verified[idx]) {
        alert('Esta pregunta ya fue verificada.');
        return;
    }
    verified[idx] = true;
    showFeedback(idx);
    updateStatusAndProgress();
}

function showFinalResults() {
    const pct = (correctCount / total) * 100;
    resultsContent.innerHTML = `✅ Has completado el cuestionario.<br>
        <span style="font-size:2rem;">${correctCount} / ${total}</span><br>
        <span style="font-size:1.4rem;">${pct.toFixed(1)}% de aciertos</span>`;
    resultsArea.style.display = 'block';
}

function resetQuiz() {
    selected = new Array(total).fill(null);
    verified = new Array(total).fill(false);
    correctCount = 0;
    current = 0;
    resultsArea.style.display = 'none';
    feedbackBox.classList.remove('show');
    renderQuestion(0);
    // Habilitar radios
    document.querySelectorAll('input[name="question"]').forEach(inp => inp.disabled = false);
    checkBtn.disabled = false;
}

// Navegación
function goPrev() {
    if (current > 0) { current--; renderQuestion(current); }
}
function goNext() {
    if (current < total-1) { current++; renderQuestion(current); }
}

// Event listeners
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
checkBtn.addEventListener('click', verifyCurrent);
resetBtn.addEventListener('click', resetQuiz);

// Inicializar
renderQuestion(0);
</script>
